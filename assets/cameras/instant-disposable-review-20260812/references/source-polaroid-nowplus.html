xt\":\" in the event that a third party acquires all or part of our business and/or assets, we may disclose your personal data to that third party in connection with the acquisition. In addition, we reserve the right to disclose your personal data to third parties as part of any business or asset sale carried out because Polaroid has gone into insolvency or any similar situation, but only where lawful and compliant with the applicable data protection legislation, as amended from time to time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f45da1d8c2b7\",\"_type\":\"block\",\"children\":[{\"_key\":\"b46575ced55c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5297e5f420b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"6347d229c2fb0\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Comply with applicable law\"},{\"_key\":\"6347d229c2fb1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"f98efa856dda\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary to comply with applicable law or an order of a governmental or law enforcement body. We may also disclose your personal data in response to a request for personal data by a competent authority if we believe disclosure is in accordance with, or is otherwise required by, any applicable law, regulation, or legal process.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"4cf48782e30a\",\"_type\":\"block\",\"children\":[{\"_key\":\"a06f7e26a0dc0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9872a4f3cf2a\",\"_type\":\"block\",\"children\":[{\"_key\":\"2bc97522bda80\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"-Subsidiaries and affiliated entities:\"},{\"_key\":\"2bc97522bda82\",\"_type\":\"span\",\"marks\":[],\"text\":\" we may share your personal data with our subsidiaries and affiliated entities within the Polaroid group that provide services or conduct data processing in relation to the Website or our services on our behalf.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48b5dfdbdbeb\",\"_type\":\"block\",\"children\":[{\"_key\":\"dc1dc14ef5df0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6b3f00d8dd91\",\"_type\":\"block\",\"children\":[{\"_key\":\"d6502b01cad70\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Other relevant parties\"},{\"_key\":\"d6502b01cad71\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"a678045745c3\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary with our processors, vendors, consultants, marketing partners, and other service providers who need access to such personal data to carry out work on our behalf for the performance of any contract we enter into (e.g. Shopify / Klarna, ZenDesk) or requests and input we receive (e.g. loyalty program, back-in-stock notifications, product reviews, newsletter subscriptions, customer requests, customer experience etc.).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"be2edefc6a7a\",\"_type\":\"block\",\"children\":[{\"_key\":\"593fbfcce7010\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bee99afa2961\",\"_type\":\"block\",\"children\":[{\"_key\":\"50f4b12e50500\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Analytics\"},{\"_key\":\"50f4b12e50501\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\":\"},{\"_key\":\"cde0e52be97d\",\"_type\":\"span\",\"marks\":[],\"text\":\"$21\"},{\"_key\":\"e680889347ed\",\"_type\":\"span\",\"marks\":[\"389455301fa8\"],\"text\":\"Google's privacy policy\"},{\"_key\":\"30d1fff833aa\",\"_type\":\"span\",\"marks\":[],\"text\":\". See also the \"},{\"_key\":\"916bd9f3e723\",\"_type\":\"span\",\"marks\":[\"852464d00690\"],\"text\":\"specific privacy policy of Google Analytics \"},{\"_key\":\"8e01d9e66c9c\",\"_type\":\"span\",\"marks\":[],\"text\":\". For more information about Google's opt-out, see \"},{\"_key\":\"eada7bcaa0a1\",\"_type\":\"span\",\"marks\":[\"1073b9e4e171\"],\"text\":\"here\"},{\"_key\":\"c1d0f24ad281\",\"_type\":\"span\",\"marks\":[],\"text\":\". This Website also uses Hotjar, which complements the data and insights we get from Google Analytics, read \"},{\"_key\":\"b3b1849e342e\",\"_type\":\"span\",\"marks\":[\"68e8389c81d1\"],\"text\":\"Hotjar’s privacy policy\"},{\"_key\":\"fd01e2a536ec\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"389455301fa8\",\"_type\":\"externalLink\",\"href\":\"https://policies.google.com/privacy?hl=en\",\"targetNewWindow\":true},{\"_key\":\"852464d00690\",\"_type\":\"externalLink\",\"href\":\"https://support.google.com/analytics/answer/6004245?hl=en\",\"targetNewWindow\":true},{\"_key\":\"1073b9e4e171\",\"_type\":\"externalLink\",\"href\":\"https://tools.google.com/dlpage/gaoptout\",\"targetNewWindow\":true},{\"_key\":\"68e8389c81d1\",\"_type\":\"externalLink\",\"href\":\"https://www.hotjar.com/legal/policies/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"f9bdf51416c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"f310636294dc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f45775d97ad0\",\"_type\":\"block\",\"children\":[{\"_key\":\"c8fd1a7fc2950\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may, in some cases, merge your personal data with the data of third parties. We do this, for example, to see your previous purchases.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Disclosure of your personal data to third parties\"},{\"_key\":\"1e24e83abedb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"258d513fc551\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ce3fd72c0340\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you subscribe to our newsletter, we will use the personal information necessary or separately provided by you to send you our e-mail newsletter as agreed. If you wish to unsubscribe from email marketing communications that we send you, you can most easily do this by clicking on the unsubscribe link at the bottom of any e-mail marketing communications that we have sent to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Email newsletter\"},{\"_key\":\"5b7fc7d1883b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"85b87b70a6bc\",\"_type\":\"block\",\"children\":[{\"_key\":\"a048f7c208140\",\"_type\":\"span\",\"marks\":[],\"text\":\"Working news media can subscribe to our Newsroom newsletter via \"},{\"_key\":\"19b197ae72c9\",\"_type\":\"span\",\"marks\":[\"ba2b56dab1d4\"],\"text\":\"press.polaroid.com\"},{\"_key\":\"8839b60d8ecc\",\"_type\":\"span\",\"marks\":[],\"text\":\". The Newsroom newsletter will include (embargoed) news, story ideas, and invites to press event. If you subscribe to our Newsroom newsletter, we will use the personal information necessary or sedately provided by you to send you our Newsroom newsletter as agreed. If you wish to unsubscribe from this newsletter, you can do so by clicking on the unsubscribe link at the bottom of any newsletter that we have sent to you. For more information about your privacy in relation to the Newsroom newsletter, please visit \"},{\"_key\":\"ba51ae25f8ef\",\"_type\":\"span\",\"marks\":[\"d11c9d08129a\"],\"text\":\"press.polaroid.com/privacy\"},{\"_key\":\"b002ec331b90\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"ba2b56dab1d4\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/\",\"targetNewWindow\":true},{\"_key\":\"d11c9d08129a\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/privacy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"7. Newsroom newsletter\"},{\"_key\":\"465087a44db3\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"df680e3cea58\",\"_type\":\"block\",\"children\":[{\"_key\":\"217f280cbd0b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"When creating a user account on the Website, you consent to becoming a memberofour loyalty program which is facilitated bythird parties (Shopify and Yotpo). For this purpose, personal data (i.e. (sur)name, email details, profile picture, personal note, and other data you choose to provide to us) and data regarding your order such as order value and potential discounts are transferred to and stored by such third party and will only be used to perform its services in connection with the loyalty program. Your user account will show your loyalty reward points and purchase information and history. If you have signed-up to receive news and offers, we will use your account data to make the offers you receive form us more relevant to you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"79786c8db3a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"9ca579efcd3a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to privacy@polaroid.com or use our custom support form on the website. For more information on the Loyalty program / Membership we refer to the \"},{\"_key\":\"bf8cb6044444\",\"_type\":\"span\",\"marks\":[\"57ac7e90271f\"],\"text\":\"Membership Terms \u0026 Conditions\"},{\"_key\":\"058625d41cdb\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"57ac7e90271f\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/membership-terms-and-conditions\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"8. User account and Loyalty program / Membership\"},{\"_key\":\"4e2182ae9430\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9abd65e42887\",\"_type\":\"block\",\"children\":[{\"_key\":\"c33bf6faf8230\",\"_type\":\"span\",\"marks\":[],\"text\":\"We allow you to register your Polaroid products in your user account on the Website. In order to register a product, you will need to provide us with the following information: product name, country of purchase, serial number, purchase date and place of purchase. By registering your products, you easily gain insight in the warranty period applicable to your Polaroid product. For more information on our warranty terms we refer to the \"},{\"_key\":\"c8afab76467b\",\"_type\":\"span\",\"marks\":[\"c8bbb4db5c36\"],\"text\":\"Warranty Policy\"},{\"_key\":\"e60df545a3a1\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"c8bbb4db5c36\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/warranty-policy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"9. Product registration\"},{\"_key\":\"8205ef91234a\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"de0ebf738f13\",\"_type\":\"block\",\"children\":[{\"_key\":\"76a4bad2f1b50\",\"_type\":\"span\",\"marks\":[],\"text\":\"We offer the option of sending a Polaroid product as a gift. To deliver the gift, we will process the recipient’s personal data (i.e. (sur)name, delivery postal addresses, email details) which we receive from the purchaser of the gift. This personal data will be used solely for the purpose of delivering the gift. We will not use the recipient’s data for marketing or any other purposes.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"10. Gifting\"},{\"_key\":\"a486937fad53\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ef2ff1b0a708\",\"_type\":\"block\",\"children\":[{\"_key\":\"92594fe4d6410\",\"_type\":\"span\",\"marks\":[],\"text\":\"In regard to fraud prevention and combatting, we use services which, among others, help us to determine whether or not a transaction should be made (should there be any doubt). For this purpose, we share certain personal information with third parties that help us to detect and prevent fraudulent transactions. The information we share with those parties includes some of the information that you share with us (such as, your contact details and information about the transaction), and some of the information from your online interactions (such as the IP address of your device). That information is used to determine whether a transaction could be fraudulent. One of the third parties we use to help us detect and prevent fraudulent transactions is a company called Signifyd; they are responsible for their use of your personal information and will use it for the purposes set out in their \"},{\"_key\":\"362d87843bdc\",\"_type\":\"span\",\"marks\":[\"0ab772bb7223\"],\"text\":\"privacy policy\"},{\"_key\":\"282413ad2c85\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"0ab772bb7223\",\"_type\":\"externalLink\",\"href\":\"https://www.signifyd.com/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"11. Fraud prevention\"},{\"_key\":\"0362bfbb4508\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"42f12ef9034f\",\"_type\":\"block\",\"children\":[{\"_key\":\"148c761782490\",\"_type\":\"span\",\"marks\":[],\"text\":\"For advertising purposes, we use the e-mail addressesof our customers and (insofar they have provided their consent) our newsletter subscribers to (i) show them Polaroid advertisements through third party websites and (ii) generate “look-a-like audience” or similar audience of potential customers through Meta or Google’s advertising platforms. This allows us to target ads on their networks to existing customers and potential customers who appear to have similar interests or demographics to our existing customers and newsletter subscribers, based on the platform’s own data.We do this by uploading a list of email addresses. \"},{\"_key\":\"f0237ff8819f\",\"_type\":\"span\",\"marks\":[\"af6062ca6200\"],\"text\":\"Meta policy\"},{\"_key\":\"3b37d7a594e1\",\"_type\":\"span\",\"marks\":[],\"text\":\" is to irreversibly hash (encrypt) such lists of prior to uploading, match the hashed data against their own users, generate the look-a-like audience, then delete the uploaded list and use it for no other purpose. We do not have access to the identity of anybody in the lookalike audience, unless they choose to click on the ads. If you wish to opt out of target or “similar audiences” in Google, you can do so through your \"},{\"_key\":\"c581a619b846\",\"_type\":\"span\",\"marks\":[\"ea8256113cf3\"],\"text\":\"Ads Settings\"},{\"_key\":\"b631d954f2a9\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"af6062ca6200\",\"_type\":\"externalLink\",\"href\":\"https://www.facebook.com/business/help/112061095610075?id=2469097953376494\",\"targetNewWindow\":true},{\"_key\":\"ea8256113cf3\",\"_type\":\"externalLink\",\"href\":\"https://adssettings.google.com/anonymous?hl=en\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"12. Look-a-like audiences\"},{\"_key\":\"c78bd0084e83\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"e1521aeb2d5b\",\"_type\":\"block\",\"children\":[{\"_key\":\"9c8e443eed5c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid uses essential, analytics and tracking cookies on the Website, as well as comparable technologies.For more information, or to change or withdraw your cookie consent settings, please see our\"},{\"_key\":\"8fd0c540f802\",\"_type\":\"span\",\"marks\":[\"a505289e5f3f\"],\"text\":\" cookies policy\"},{\"_key\":\"86ddc09bb432\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"a505289e5f3f\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"86230e6b-45d5-4482-988e-30c2c2251c12\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"13. Cookies and comparable technologies\"},{\"_key\":\"37ed9552dbc8\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"7bf986a24e31\",\"_type\":\"block\",\"children\":[{\"_key\":\"fc242a2b5d2f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We (or our processors) may transfer personal data that we collect from you to third party (sub) processors located in countries that are outside of the European Economic Area (\"},{\"_key\":\"fc242a2b5d2f1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EEA\"},{\"_key\":\"fc242a2b5d2f2\",\"_type\":\"span\",\"marks\":[],\"text\":\") and to other Polaroid group companies in connection with the above purposes.For example, some Polaroid group companies or processors are domiciled in the United States, which leads to the disclosing of your personal data outside the EEA.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fee05a8b39bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"b610612eb2fd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"In such situations, we will ensure that appropriate safeguards are in place that offer an adequate level of protection of your rights and freedoms as a data subject in accordance with the GDPR. We do this, for example, by concluding standard contractual clauses for the transfer of personal data approved by the European Commission, or by transferring your personal data only to third parties that are considered to guarantee an adequate level of protection according to the European Commission.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"14. International transfers\"},{\"_key\":\"fa864708ae9f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"8a9ee8ab8b37\",\"_type\":\"block\",\"children\":[{\"_key\":\"48da7c1cf6e80\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will never ask you to confirm any account or credit card details via email. If you receive an email claiming to be from us asking you to do so, please ignore it and do not respond. You may forward any such e-mail to \"},{\"_key\":\"b39bec060f66\",\"_type\":\"span\",\"marks\":[\"f43b5f0813eb\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"74227b935b2c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"f43b5f0813eb\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"15. Spoof/false emails\"},{\"_key\":\"db8e8f603487\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9c8c8e1b4e20\",\"_type\":\"block\",\"children\":[{\"_key\":\"17fc0abf6ad90\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will retain your personal data for no longer than is necessary for the purpose(s) for which it is collected or processed and/or in accordance with legal obligations.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"91ec4a6b03ee\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9c44335b8cc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Below you will find an overview of the typical retention periods we apply for different types of processing activities:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"69bc5e9a71da\",\"_type\":\"block\",\"children\":[{\"_key\":\"00c8b7436f0f0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"User Account / Loyalty Program\"},{\"_key\":\"00c8b7436f0f1\",\"_type\":\"span\",\"marks\":[],\"text\":\": If you have a user account with us, we will keep your data for up to 2 years after your last login or interaction, unless you ask us to remove your account earlier. If you don’t reactivate your account during this time, we will notify you and either delete or anonymize your data unless you let us know you wish to keep your account active.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e04808fef3bc\",\"_type\":\"block\",\"children\":[{\"_key\":\"be95752118970\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Order and Transaction Data:\"},{\"_key\":\"be95752118971\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data related to your purchases, orders, and returns is retained for 7 years after the end of the relevant tax year, in accordance with legal obligations for accounting and tax purposes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"464cd5bc1120\",\"_type\":\"block\",\"children\":[{\"_key\":\"81289f4b4cc80\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Newsletter Subscription:\"},{\"_key\":\"81289f4b4cc81\",\"_type\":\"span\",\"marks\":[],\"text\":\" If you subscribe to our newsletter or receive marketing communications, we retain your data until you unsubscribe or withdraw your consent.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c028e19521b1\",\"_type\":\"block\",\"children\":[{\"_key\":\"5506759b8e5d0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Customer Service and Complaints:\"},{\"_key\":\"5506759b8e5d1\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected in connection with customer service requests or complaints is retained for up to 2 years after the issue is resolved, unless a longer retention period is required due to legal claims or disputes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f0b55dd59b54\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b481f682f880\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Fraud Prevention:\"},{\"_key\":\"1b481f682f881\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data processed for fraud prevention is retained for up to 5 years, unless a longer period is required for ongoing investigations or legal proceedings.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"461d91f36db0\",\"_type\":\"block\",\"children\":[{\"_key\":\"849d3adae9020\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Cookies and Analytics:\"},{\"_key\":\"849d3adae9021\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected via cookies and similar technologies is retained according to our cookie policy, typically ranging from session-based retention to a maximum of 2 years.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"310777e080d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"a1c1c9123e0d0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Usage and preference data, Device data, Location data and Log data:\"},{\"_key\":\"a1c1c9123e0d1\",\"_type\":\"span\",\"marks\":[],\"text\":\" This type of data will be anonymized as soon as we collect it.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"44ccf71312b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"e595593ba5c10\",\"_type\":\"span\",\"marks\":[],\"text\":\"After a retention period, we will delete or anonymize your personal data, unless we retain (part of) of your personal data for another purpose. We will only do so if we have a legal basis to retain your personal data. We will ensure that personal data are only accessible for that other purpose.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48c8727665a3\",\"_type\":\"block\",\"children\":[{\"_key\":\"3d2a9318d5320\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you would like to receive more information about the retention periods that we apply, please contact us on \"},{\"_key\":\"7e83e101698a\",\"_type\":\"span\",\"marks\":[\"3110ee924dd4\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"50f62e0784d6\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"3110ee924dd4\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"16. Data retention\"},{\"_key\":\"14207bce66d4\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b1b2e7ad87e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"6f311f68ddbd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"As a data subject, you have a number of rights that you may exercise in the context of our processing of your personal data:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"328a13996252\",\"_type\":\"block\",\"children\":[{\"_key\":\"b654b50519af0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f05747717213\",\"_type\":\"block\",\"children\":[{\"_key\":\"c76addd3dedd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"c76addd3dedd1\",\"_type\":\"span\",\"marks\":[ ",\"_type\":\"span\",\"marks\":[],\"text\":\"), as well as the national implementation acts of the GDPR.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"674e0c766cee\",\"_type\":\"block\",\"children\":[{\"_key\":\"49b8707473b9\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"22b97d9ce61e\",\"_type\":\"block\",\"children\":[{\"_key\":\"4585dba3c9280\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"PRIVACY NOTICE FOR CALIFORNIA RESIDENTS:\"},{\"_key\":\"1721b07caebf\",\"_type\":\"span\",\"marks\":[],\"text\":\" Consumers residing in California have some additional rights with respect to their personal information under the California Consumer Privacy Act (\"},{\"_key\":\"4585dba3c9282\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"CCPA\"},{\"_key\":\"4585dba3c9283\",\"_type\":\"span\",\"marks\":[],\"text\":\"). If you are a California resident, this notice applies to you and supplements the main privacy policy \"},{\"_key\":\"408f884b7c0e\",\"_type\":\"span\",\"marks\":[\"8f1d1efea28a\"],\"text\":\"here\"},{\"_key\":\"12b2bdfa37e5\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"8f1d1efea28a\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"d80cdda5-1b8f-4535-b74a-c94469917fbf\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"8219b72060a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"82f855e4159b0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"NOTICE FOR NEVADA RESIDENTS:\"},{\"_key\":\"df6ae4e3a56f\",\"_type\":\"span\",\"marks\":[],\"text\":\" Under Nevada law, Nevada residents may opt out of the sale of certain “covered information” collected by operators of websites or online services. We currently do not sell covered information, as “sale” is defined by such law, and do not have plans to do so. In accordance with Nevada law, you may submit to us a verified request instructing us not to sell your covered information. Such requests can be submitted in accordance with the instructions provided in the Policy.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8aa48714279d\",\"_type\":\"block\",\"children\":[{\"_key\":\"d5bd48bc5c29\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fca875b63b97\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9a6a5692b00\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"}]},{\"_key\":\"0f634af1187f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"f85ebeebf1a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"6c386b3619ee\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid is a company registered with the commercial register in The Netherlands (Chamber of Commerce registration number 59065982) whose registered office is at Danzigerkade 16C, 1013 AP, Amsterdam, The Netherlands. Polaroid is part of the Polaroid group of companies. You may contact us on \"},{\"_key\":\"1905bb0eae72\",\"_type\":\"span\",\"marks\":[\"b37f564a3067\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"307503442023\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"b37f564a3067\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"},{\"_key\":\"1e623c38ff05\",\"_type\":\"block\",\"children\":[{\"_key\":\"f5cf08c055f3\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b66bdc030182\",\"_type\":\"block\",\"children\":[{\"_key\":\"eb4d00f1d944\",\"_type\":\"span\",\"marks\":[],\"text\":\"With regard to your personal data that we process (see paragraph 2), we are the controller within the meaning of the GDPR. This means we have certain statutory duties and responsibilities regarding our processing activities. This Privacy Policy serves to inform you on how we meet our duties and responsibilities.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"1. Who we are\"},{\"_key\":\"9c0a4757df6a\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"6fd4e60bbb46\",\"_type\":\"block\",\"children\":[{\"_key\":\"f154da62bf42\",\"_type\":\"span\",\"marks\":[],\"text\":\"We and/or third-party data processors acting on our behalf (see paragraph 5) may collect the following personal data about you:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"094bad99276e\",\"_type\":\"block\",\"children\":[{\"_key\":\"2cf3fe502810\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Personal data you provide to us:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1958b1700162\",\"_type\":\"block\",\"children\":[{\"_key\":\"9c26d93fe87b\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"User data\"},{\"_key\":\"3740f189e2f4\",\"_type\":\"span\",\"marks\":[],\"text\":\": your (sur)name, your billing and delivery postal addresses, phone (including mobile phone), email details, your user name and password, profile picture, personal mark, any other information you choose to provide to us and payment details (all payment details you provide through our Website are processed and/or stored by a third party credit card or payment facilitator or processor, and not by us);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a026339c7a4c\",\"_type\":\"block\",\"children\":[{\"_key\":\"26eeb865f1ae\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Usage and preference data\"},{\"_key\":\"e8d8bb5af157\",\"_type\":\"span\",\"marks\":[],\"text\":\": we collect data about how you and other users interact with our services, preferences expressed (e.g. communication and shopping preferences), and settings chosen;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f34a55b007d2\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b0d6fc26997\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Device data\"},{\"_key\":\"8d65addc4643\",\"_type\":\"span\",\"marks\":[],\"text\":\": we collect data about your computer or mobile device, including, for example, the hardware model, operating system and version, software, IP address, file names and versions and preferred language;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b234c9484de8\",\"_type\":\"block\",\"children\":[{\"_key\":\"1f1624bb2567\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Location data\"},{\"_key\":\"c3979a53902a\",\"_type\":\"span\",\"marks\":[],\"text\":\"; we collect data about the location where your device is used, including where you have registered with us and where you place an order with us; and\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a6e888c3e752\",\"_type\":\"block\",\"children\":[{\"_key\":\"f16a0f733856\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Log data\"},{\"_key\":\"be03ec6b4cb0\",\"_type\":\"span\",\"marks\":[],\"text\":\": when you interact with our services within the Website, we create logs, which include browsing and online shopping activities, access dates and times, app features or web pages viewed, app crashes and other system activity;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5c180ad98f11\",\"_type\":\"block\",\"children\":[{\"_key\":\"400297a796f0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Purchase information and history\"},{\"_key\":\"995a12a4e252\",\"_type\":\"span\",\"marks\":[],\"text\":\": information on your purchases, orders and returns.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"85b4bcd96c2a\",\"_type\":\"block\",\"children\":[{\"_key\":\"cb505ef4342d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"164b0310db0a\",\"_type\":\"block\",\"children\":[{\"_key\":\"52784f9abe43\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Personal data collected from other (third party) sources:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"22aaa88a0598\",\"_type\":\"block\",\"children\":[{\"_key\":\"575030a9374d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"af1801056e00\",\"_type\":\"block\",\"children\":[{\"_key\":\"6e0e224c1207\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Personal data available through public sources\"},{\"_key\":\"9b9fa37d78a1\",\"_type\":\"span\",\"marks\":[],\"text\":\": In order to be able to properly offer our services and products, to create the best user experience and for marketing/PR purposes, we collect personal data from third parties, such as app stores, social media platforms, operating system and device manufacturers, and analytical companies.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9e86ac064a80\",\"_type\":\"block\",\"children\":[{\"_key\":\"413748e4c763\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"50934e870a72\",\"_type\":\"block\",\"children\":[{\"_key\":\"02cced75b716\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may also collect some or all of this personal data from third parties who have your consent to pass your details to us. This is the case with e-mail addresses you fill in using forms on other websites provided by Klaviyo and/or other third party service providers, regarding your name, e-mail address and eligible use instances of social media tools in the context of amongst others our loyalty program (for more information see paragraph 8). This is also the case regarding unique visitor identifiers as assigned by Meta and Google through usage of, for example, “Facebook Pixel” and “Google Analytics”. When you provide us with your e-mail address, we may send it in hashed form to Google to help us improve our conversion measurement, by using Google Enhanced Conversions (see our \"},{\"_key\":\"7eb8ce3b0f5c\",\"_type\":\"span\",\"marks\":[\"bf5cefdfae25\"],\"text\":\"cookie policy\"},{\ nt from our services is presented in the most effective manner, to troubleshoot software burgs and operational problems and provide you with information on products and offers which are relevant to you.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"63d03bbcf5ce\",\"_type\":\"block\",\"children\":[{\"_key\":\"b487bfb05002\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a3b380e35b30\",\"_type\":\"block\",\"children\":[{\"_key\":\"5de4b57d9340\",\"_type\":\"span\",\"marks\":[],\"text\":\"When processing is based on \"},{\"_key\":\"68eb5412deac\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"consent\"},{\"_key\":\"b5d9285bb1b6\",\"_type\":\"span\",\"marks\":[],\"text\":\", you have the right to refuse consent at any time without prejudice. You also have the right to withdraw your granted consent at any time, after which we will stop the further processing of your personal data. However, withdrawal of your consent does not affect the lawfulness of the processing prior to that moment. Please note that if you withdraw your consent certain features of our Website, products and/or services may no longer be accessible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Legal bases of the processing of your personal data\"},{\"_key\":\"e3e4240dfc6c\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"e0c85dc48eba\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6c7cd87b235\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid (and third party data processors acting on our behalf) may collect, store and process your personal data for the following purposes:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f7b7395c3e46\",\"_type\":\"block\",\"children\":[{\"_key\":\"80824c981eef\",\"_type\":\"span\",\"marks\":[],\"text\":\"A. to make our Website available to you;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"024b287ad159\",\"_type\":\"block\",\"children\":[{\"_key xample, to see your previous purchases.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Disclosure of your personal data to third parties\"},{\"_key\":\"c7bea5c99317\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"14b4b440a0e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"bdbd85c872cc\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you subscribe to our newsletter, we will use the personal information necessary or separately provided by you to send you our e-mail newsletter as agreed. If you wish to unsubscribe from email marketing communications that we send you, you can most easily do this by clicking on the unsubscribe link at the bottom of any e-mail marketing communications that we have sent to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Email newsletter\"},{\"_key\":\"5e3b4e186fc1\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"3d497feecb3c\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ae4ee815012\",\"_type\":\"span\",\"marks\":[],\"text\":\"Working news media can subscribe to our Newsroom newsletter via \"},{\"_key\":\"d4dce82744a3\",\"_type\":\"span\",\"marks\":[\"f7525163a3b0\"],\"text\":\"press.polaroid.com\"},{\"_key\":\"4a88b201fde3\",\"_type\":\"span\",\"marks\":[],\"text\":\". The Newsroom newsletter will include (embargoed) news, story ideas, and invites to press event. If you subscribe to our Newsroom newsletter, we will use the personal information necessary or sedately provided by you to send you our Newsroom newsletter as agreed. If you wish to unsubscribe from this newsletter, you can do so by clicking on the unsubscribe link at the bottom of any newsletter that we have sent to you. For more information about your privacy in relation to the Newsroom newsletter, please visit \"},{\"_key\":\"e9c11785c99d\",\"_type\":\"span\",\"marks\":[\"68c8662a0fa2\"],\"text\":\"press.polaroid.com/privacy\"},{\"_key\":\"711bc259f840\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"f7525163a3b0\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/\",\"targetNewWindow\":true},{\"_key\":\"68c8662a0fa2\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/privacy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"7. Newsroom newsletter\"},{\"_key\":\"9c8c687f60fb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"f61990e899bb\",\"_type\":\"block\",\"children\":[{\"_key\":\"1971bcb166ff\",\"_type\":\"span\",\"marks\":[],\"text\":\"When creating a user account on the Website, you consent to becoming a memberofour loyalty program which is facilitated bythird parties (Shopify and Yotpo). For this purpose, personal data (i.e. (sur)name, email details, profile picture, personal note, and other data you choose to provide to us) and data regarding your order such as order value and potential discounts are transferred to and stored by such third party and will only be used to perform its services in connection with the loyalty program. Your user account will show your loyalty reward points and purchase information and history. If you have signed-up to receive news and offers, we will use your account data to make the offers you receive form us more relevant to you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8851777e69b0\",\"_type\":\"block\",\"children\":[{\"_key\":\"468146a70e4b\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to privacy@polaroid.com or use our custom support form on the website. For more information on the Loyalty program / Membership we refer to the \"},{\"_key\":\"e71bf5a48696\",\"_type\":\"span\",\"marks\":[\"2148098625a9\"],\"text\":\"Membership Terms \u0026 Conditions\"},{\"_key\":\"b2b292edcd5c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"2148098625a9\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/membership-terms-and-conditions\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"8. User account and Loyalty program / Membership\"},{\"_key\":\"6a8d50435047\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b067ed3972bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"f7ca786a379f\",\"_type\":\"span\",\"marks\":[],\"text\":\"We allow you to register your Polaroid products in your user account on the Website. In order to register a product, you will need to provide us with the following information: product name, country of purchase, serial number, purchase date and place of purchase. By registering your products, you easily gain insight in the warranty period applicable to your Polaroid product. For more information on our warranty terms we refer to the \"},{\"_key\":\"a3ec4b5256f3\",\"_type\":\"span\",\"marks\":[\"2a3cdf2a5a30\"],\"text\":\"Warranty Policy\"},{\"_key\":\"8cbbfabd5266\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"2a3cdf2a5a30\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/warranty-policy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"9. Product registration\"},{\"_key\":\"6d2c1e0b71ed\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"79b6c265eba3\",\"_type\":\"block\",\"children\":[{\"_key\":\"47dc71114534\",\"_type\":\"span\",\"marks\":[],\"text\":\"We offer the option of sending a Polaroid product as a gift. To deliver the gift, we will process the recipient’s personal data (i.e. (sur)name, delivery postal addresses, email details) which we receive from the purchaser of the gift. This personal data will be used solely for the purpose of delivering the gift. We will not use the recipient’s data for marketing or any other purposes.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"10. Gifting\"},{\"_key\":\"7ee017c7b618\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ea9c16c04a7c\",\"_type\":\"block\",\"children\":[{\"_key\":\"673c3d140e44\",\"_type\":\"span\",\"marks\":[],\"text\":\"In regard to fraud prevention and combatting, we use services which, among others, help us to determine whether or not a transaction should be made (should there be any doubt). For this purpose, we share certain personal information with third parties that help us to detect and prevent fraudulent transactions. The information we share with those parties includes some of the information that you share with us (such as, your contact details and information about the transaction), and some of the information from your online interactions (such as the IP address of your device). That information is used to determine whether a transaction could be fraudulent. One of the third parties we use to help us detect and prevent fraudulent transactions is a company called Signifyd; they are responsible for their use of your personal information and will use it for the purposes set out in their \"},{\"_key\":\"a196bd6531bb\",\"_type\":\"span\",\"marks\":[\"1ce50d4a7142\"],\"text\":\"privacy policy\"},{\"_key\":\"a4fc2dc15008\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"1ce50d4a7142\",\"_type\":\"externalLink\",\"href\":\"https://www.signifyd.com/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"11. Fraud prevention\"},{\"_key\":\"37de368036ac\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"3a0d37239d92\",\"_type\":\"block\",\"children\":[{\"_key\":\"bec70d91fefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"For advertising purposes, we use the e-mail addressesof our customers and (insofar they have provided their consent) our newsletter subscribers to (i) show them Polaroid advertisements through third party websites and (ii) generate “look-a-like audience” or similar audience of potential customers through Meta or Google’s advertising platforms. This allows us to target ads on their networks to existing customers and potential customers who appear to have similar interests or demographics to our existing customers and newsletter subscribers, based on the platform’s own data.We do this by uploading a list of email addresses. \"},{\"_key\":\"2dbc6a47d0e3\",\"_type\":\"span\",\"marks\":[\"8ff52fc8a210\"],\"text\":\"Meta policy\"},{\"_key\":\"34c0336da7aa\",\"_type\":\"span\",\"marks\":[],\"text\":\" is to irreversibly hash (encrypt) such lists of prior to uploading, match the hashed data against their own users, generate the look-a-like audience, then delete the uploaded list and use it for no other purpose. We do not have access to the identity of anybody in the lookalike audience, unless they choose to click on the ads. If you wish to opt out of target or “similar audiences” in Google, you can do so through your \"},{\"_key\":\"9a0beb9424c1\",\"_type\":\"span\",\"marks\":[\"339bc1b0a18e\"],\"text\":\"Ads Settings\"},{\"_key\":\"252668e4a9d8\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"8ff52fc8a210\",\"_type\":\"externalLink\",\"href\":\"https://www.facebook.com/business/help/112061095610075?id=2469097953376494\",\"targetNewWindow\":true},{\"_key\":\"339bc1b0a18e\",\"_type\":\"externalLink\",\"href\":\"https://adssettings.google.com/anonymous?hl=en\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"12. Look-a-like audiences\"},{\"_key\":\"33666719b52e\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"f26e05f796fd\",\"_type\":\"block\",\"children\":[{\"_key\":\"1d54ecf8658d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid uses essential, analytics and tracking cookies on the Website, as well as comparable technologies.For more information, or to change or withdraw your cookie consent settings, please see our\"},{\"_key\":\"35993be6e059\",\"_type\":\"span\",\"marks\":[\"6d56fc3c29ab\"],\"text\":\" cookies policy\"},{\"_key\":\"48c2e9e0c7e8\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"6d56fc3c29ab\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"86230e6b-45d5-4482-988e-30c2c2251c12\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"13. Cookies and comparable technologies\"},{\"_key\":\"e27b669faae8\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"012d6bd8c2b9\",\"_type\":\"block\",\"children\":[{\"_key\":\"671f1e78c770\",\"_type\":\"span\",\"marks\":[],\"text\":\"We (or our processors) may transfer personal data that we collect from you to third party (sub) processors located in countries that are outside of the European Economic Area (\"},{\"_key\":\"597b3903b416\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EEA\"},{\"_key\":\"159ad053ffe6\",\"_type\":\"span\",\"marks\":[],\"text\":\") and to other Polaroid group companies in connection with the above purposes.For example, some Polaroid group companies or processors are domiciled in the United States, which leads to the disclosing of your personal data outside the EEA.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bed3318808aa\",\"_type\":\"block\",\"children\":[{\"_key\":\"ed34ed3157ec\",\"_type\":\"span\",\"marks\":[],\"text\":\"In such situations, we will ensure that appropriate safeguards are in place that offer an adequate level of protection of your rights and freedoms as a data subject in accordance with the GDPR. We do this, for example, by concluding standard contractual clauses for the transfer of personal data approved by the European Commission, or by transferring your personal data only to third parties that are considered to guarantee an adequate level of protection according to the European Commission.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"14. International transfers\"},{\"_key\":\"ed6cc2f374d0\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"0d23c945210f\",\"_type\":\"block\",\"children\":[{\"_key\":\"d88b255cd6e7\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will never ask you to confirm any account or credit card details via email. If you receive an email claiming to be from us asking you to do so, please ignore it and do not respond. You may forward any such e-mail to \"},{\"_key\":\"2065530798dc\",\"_type\":\"span\",\"marks\":[\"71cbc6dc724e\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"b9af9df21127\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"71cbc6dc724e\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"15. Spoof/false emails\"},{\"_key\":\"fac08844ac62\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"feb4a34bb6df\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a5e9030f841\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will retain your personal data for no longer than is necessary for the purpose(s) for which it is collected or processed and/or in accordance with legal obligations.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f04c3a20cc77\",\"_type\":\"block\",\"children\":[{\"_key\":\"8f3cca2384c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Below you will find an overview of the typical retention periods we apply for different types of processing activities:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"37a001a8615d\",\"_type\":\"block\",\"children\":[{\"_key\":\"2dade4c1823f\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"User Account / Loyalty Program\"},{\"_key\":\"0a2a086228a5\",\"_type\":\"span\",\"marks\":[],\"text\":\": If you have a user account with us, we will keep your data for up to 2 years after your last login or interaction, unless you ask us to remove your account earlier. If you don’t reactivate your account during this time, we will notify you and either delete or anonymize your data unless you let us know you wish to keep your account active.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"93003420df97\",\"_type\":\"block\",\"children\":[{\"_key\":\"c45f223a8e7e\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Order and Transaction Data:\"},{\"_key\":\"c26a2838a1d4\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data related to your purchases, orders, and returns is retained for 7 years after the end of the relevant tax year, in accordance with legal obligations for accounting and tax purposes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"297e6d6590c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"2b3cbb4c9d0a\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Newsletter Subscription:\"},{\"_key\":\"e9c3c584be86\",\"_type\":\"span\",\"marks\":[],\"text\":\" If you subscribe to our newsletter or receive marketing communications, we retain your data until you unsubscribe or withdraw your consent.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0ea0a404782a\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b29f731bc98\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Customer Service and Complaints:\"},{\"_key\":\"cc6a94572878\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected in connection with customer service requests or complaints is retained for up to 2 years after the issue is resolved, unless a longer retention period is required due to legal claims or disputes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"32f7d744cc47\",\"_type\":\"block\",\"children\":[{\"_key\":\"de59e252647b\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Fraud Prevention:\"},{\"_key\":\"d5248da431a1\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data processed for fraud prevention is retained for up to 5 years, unless a longer period is required for ongoing investigations or legal proceedings.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"afc4caf0eb11\",\"_type\":\"block\",\"children\":[{\"_key\":\"cc0dbd329785\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Cookies and Analytics:\"},{\"_key\":\"25d064a70450\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected via cookies and similar technologies is retained according to our cookie policy, typically ranging from session-based retention to a maximum of 2 years.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ee57a3d325e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"54b60ded308d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Usage and preference data, Device data, Location data and Log data:\"},{\"_key\":\"14fe335d26c0\",\"_type\":\"span\",\"marks\":[],\"text\":\" This type of data will be anonymized as soon as we collect it.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9fa43536d50b\",\"_type\":\"block\",\"children\":[{\"_key\":\"ba6b8dbe3e93\",\"_type\":\"span\",\"marks\":[],\"text\":\"After a retention period, we will delete or anonymize your personal data, unless we retain (part of) of your personal data for another purpose. We will only do so if we have a legal basis to retain your personal data. We will ensure that personal data are only accessible for that other purpose.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f8a2b4eb05e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"436ee257f0e6\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you would like to receive more information about the retention periods that we apply, please contact us on \"},{\"_key\":\"c633b7eb22e8\",\"_type\":\"span\",\"marks\":[\"5fc2a2653f96\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"6cc7b83b0040\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"5fc2a2653f96\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"16. Data retention\"},{\"_key\":\"9a391349406d\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"2f1915facb85\",\"_type\":\"block\",\"children\":[{\"_key\":\"00652ad9feff\",\"_type\":\"span\",\"marks\":[],\"text\":\"As a data subject, you have a number of rights that you may exercise in the context of our processing of your personal data:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"391d405f1f15\",\"_type\":\"block\",\"children\":[{\"_key\":\"befb4d38d4de\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"70e73e0f8325\",\"_type\":\"block\",\"children\":[{\"_key\":\"6984560d3e37\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"810e662530c3\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right of information\"},{\"_key\":\"a7ae7352233a\",\"_type\":\"span\",\"marks\":[],\"text\":\" about the personal data we process about you;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f81d97e9991c\",\"_type\":\"block\",\"children\":[{\"_key\":\"e2feeffc9ec2\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"8f7d20110b32\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to access\"},{\"_key\":\"e239b719bdbc\",\"_type\":\"span\",\"marks\":[],\"text\":\" your processed personal data;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5c496f446ede\",\"_type\":\"block\",\"children\":[{\"_key\":\"da018348f17c\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"e4954b6b8d79\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to rectification of the\"},{\"_key\":\"9d61f4b47f1f\",\"_type\":\"span\",\"marks\":[],\"text\":\" personal data that we hold about you;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8b75442c5d8a\",\"_type\":\"block\",\"children\":[{\"_key\":\"63a2afc54f1b\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"bb03be9dc640\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to erasure\"},{\"_key\":\"14d966b2779c\",\"_type\":\"span\",\"marks\":[],\"text\":\" of your personal data (under circumstances listed in the applicable law);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ef8a07cef534\",\"_type\":\"block\",\"children\":[{\"_key\":\"95a6a5999bd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"8b5bd1d106d5\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to restrict\"},{\"_key\":\"b349e036d3c0\",\"_type\":\"span\",\"marks\":[],\"text\":\" the processing of your personal data (under circumstances listed in the applicable law);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a6fa03a3e58f\",\"_type\":\"block\",\"children\":[{\"_key\":\"e2fbdbd5073e\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"7e99af311e5a\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to object\"},{\"_key\":\"820670b64fcf\",\"_type\":\"span\",\"marks\":[],\"text\":\" against the processing of your personal data (e.g. in relation to the processing of your personal data for advertising purposes);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"28cbb68a82e8\",\"_type\":\"block\",\"children\":[{\"_key\":\"b80d700941c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"e43bdd8dbb81\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to data portability\"},{\"_key\":\"0e556e681285\",\"_type\":\"span\",\"marks\":[],\"text\":\" (you can ask us to provide you or a third party with your personal data in a readable and accessible form); and\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"185d94c5549b\",\"_type\":\"block\",\"children\":[{\"_key\":\"e6bae0820756\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"5d00a131f039\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to withdraw\"},{\"_key\":\"69107611eb4b\",\"_type\":\"span\",\"marks\":[],\"text\":\" your consent to the processing of your personal data.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b77bb853b646\",\"_type\":\"block\",\"children\":[{\"_key\":\"d47b165f742a\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"197c1a3067d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"d562f1505754\",\"_type\":\"span\",\"marks\":[],\"text\":\"For security purposes we may occasionally request proof of identity before we are able to exercise your rights. If you wish to exercise any of the above rights, please contact us on \"},{\"_key\":\"b543a77df3e3\",\"_type\":\"span\",\"marks\":[\"c6f28d270f19\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"7f02598d8367\",\"_type\":\"span\",\"marks\":[],\"text\":\". Please take into account that your rights are not absolute in all cases, and that we may not be required to comply with your request. If that is the case, we will make sure you will be informed of this.\"}],\"markDefs\":[{\"_key\":\"c6f28d270f19\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"17. Your rights\"},{\"_key\":\"66b76b1f44dd\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"945cf725cbed\",\"_type\":\"block\",\"children\":[{\"_key\":\"8a4735664e6e\",\"_type\":\"span\",\"marks\":[],\"text\":\"This Website contains links to other websites operated by third parties. Please note that this Privacy Policy applies only to the personal data that we collect through this Website and we are not responsible for personal data that third parties may collect, store, and use through their websites. We recommend that you check the privacy policies of such other websites.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ba2ad8774e66\",\"_type\":\"block\",\"children\":[{\"_key\":\"4b3200e35922\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do not exercise control over the websites that may be linked to the Website. These other websites may place their own cookies or other files on your computer, collect data, or solicit personal information from you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"18. Third party sites\"},{\"_key\":\"652aeac02ef0\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"97669f9000f8\",\"_type\":\"block\",\"children\":[{\"_key\":\"8fdd4d96b9ab\",\"_type\":\"span\",\"marks\":[],\"text\":\"This Privacy Policy was last updated in December 2025 and replaces our previous Privacy Policy.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b7451b51b433\",\"_type\":\"block\",\"children\":[{\"_key\":\"7888bf9c41bb\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"73dbe2383934\",\"_type\":\"block\",\"children\":[{\"_key\":\"e25c3d6e5ab0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please check regularly to stay informed of updates to this Privacy Policy. If we make any changes to this Privacy Policy in the future, we will publish the revised Privacy Policy on the Website. If changes are made that may significantly affect you as a data subject, we will do our best to directly inform you about those changes. All changes will take effect as soon as the Privacy Policy has been published on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"19. Updates to this Privacy Policy\"},{\"_key\":\"cfa336c93dec\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"4c4644781c58\",\"_type\":\"block\",\"children\":[{\"_key\":\"bf6cff013b17\",\"_type\":\"span\",\"marks\":[],\"text\":\"In case you have any questions or complaints regarding the processing or your personal data, please contact us on \"},{\"_key\":\"cd91305c3539\",\"_type\":\"span\",\"marks\":[\"88d4084152fc\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"d4058afb7948\",\"_type\":\"span\",\"marks\":[],\"text\":\". If you are of the opinion that we process your personal data in an improper or unlawful manner, that we do not/insufficiently take regard of your objection or request in the context of your rights or if you wish to make a complaint in the context of the processing of your personal data, you have at all times the right to lodge a complaint with the competent Data Protection Authority.\"}],\"markDefs\":[{\"_key\":\"88d4084152fc\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"20. Contact us\"}],\"campaign\":null,\"category\":null,\"description\":\"This Privacy Policy explains how Polaroid International B.V. (Polaroid, we or our) collects, stores and uses your personal data when you visit or make a purchase from our website (www.polaroid.com including without limitation the sub domain names, hereinafter referred to as the Website), have an account and/or are a member of our loyalty program or if you are a user of a product or service offered by Polaroid or its affiliated companies. Please read this Privacy Policy carefully. \\n\\nWe respect your right to privacy. The processing of your personal data is subject to the rules of the General Data Protection Regulation ((EU) 2016/679) (GDPR), as well as the national implementation acts of the GDPR.\\n\",\"seoDescription\":\" \",\"seoTitle\":\"Polaroid Privacy Policy\",\"slug\":{\"_type\":\"slug\",\"current\":\"privacy-policy\"},\"title\":\"Privacy Policy\"}}],\"style\":\"normal\"}],\"newsletterDescription\":\"Sign up to our newsletter to stay up to date on all things Polaroid.\",\"newsletterErrorDescription\":\"Looks like something went wrong when trying to add you to our mailing list, please try again later.\",\"newsletterErrorTitle\":\"Something went wrong\",\"newsletterExitColor\":\"light\",\"newsletterImage\":{\"alt\":\"Newsletter popup \",\"id\":\"86720ae9-a002-4a0a-906b-d666fa28a7f1\",\"image\":{\"asset\":{\"_ref\":\"image-800dd5db1d8424698892e8d7c9dd32bea09e5a53-1108x1108-jpg\",\"_type\":\"reference\"},\"crop\":null,\"hotspot\":null},\"type\":\"assetImage\"},\"newsletterTitle\":\"Join our newsletter!\",\"newsletterVideo\":{\"asset\":{\"url\":\"https://cdn.sanity.io/files/ieogcuy1/production/294d6cb529619906b6dba6ffb039115858aabbec.mp4\"}},\"plpErrorPageText\":\"It looks like the page you're trying to reach, doesn't exist.\\nChange your url and try another shot.\",\"plpErrorPageTitle\":\"No subcategory found\",\"plpMem
