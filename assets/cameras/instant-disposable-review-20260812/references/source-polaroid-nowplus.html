 use. It is not permitted to use our Website to purchase products for resale or export to companies. We also reserve the right to limit or prohibit orders that, in our sole judgment, appear to be placed for resale or export.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6e92cfe0a1f3\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6810e2f7a240\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"a6810e2f7a241\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Minors\"},{\"_key\":\"a6810e2f7a242\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe do not sell goods for purchase by minors. If you are under 18 you may only order with the permission of a legal representative.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9bbedd368b44\",\"_type\":\"block\",\"children\":[{\"_key\":\"3f5510759e700\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2ab3046a462c\",\"_type\":\"block\",\"children\":[{\"_key\":\"958f125496720\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Availability products\"},{\"_key\":\"958f125496721\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe usually list unavailability information for out of stock products on the respective information page of those products. Beyond what we say on that page or elsewhere on the Website, we cannot be more specific about availability. As we process your order, we will inform you by email as soon as possible if any products you order turn out to be unavailable. You will not be charged for those products and if already charged, a refund shall be issued.\\n\\n\"},{\"_key\":\"958f125496722\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Accurate account\"},{\"_key\":\"958f125496723\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou agree to provide current, complete and accurate purchase and account information for all purchases made through our Website. You agree to promptly update your account and other information, including your email address and credit card numbers and expiration dates, so that we can complete your transactions and contact you as needed.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"65dddff8dd68\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc8d7b5155b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"1dc8d7b5155b1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Privacy\"},{\"_key\":\"1dc8d7b5155b2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nBy submitting orders you consent to the processing of personal data, such as name and title, address, telephone number, contact details and other personal details in accordance with the terms notified in our \"},{\"_key\":\"7b92d491ef27\",\"_type\":\"span\",\"marks\":[\"7c5faaa66e44\"],\"text\":\"privacy policy\"},{\"_key\":\"3db8f988271c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"7c5faaa66e44\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"2. Order\"},{\"_key\":\"97b0ed0dc3ca\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"151c6408ce43\",\"_type\":\"block\",\"children\":[{\"_key\":\"704ba19999660\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Prices\"},{\"_key\":\"704ba19999661\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nPrices for our products are subject to change without notice.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cd247e2a1ff1\",\"_type\":\"block\",\"children\":[{\"_key\":\"cbf5262b07b80\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"cbf5262b07b81\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Invoices\"},{\"_key\":\"cbf5262b07b82\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou consent to receive sales invoices electronically via email.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"193bc74627f2\",\"_type\":\"block\",\"children\":[{\"_key\":\"21e3d47e76da0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"21e3d47e76da1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tax\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0989a15506de\",\"_type\":\"block\",\"children\":[{\"_key\":\"d521d0c6a9be0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Within the European Union (\"},{\"_key\":\"d521d0c6a9be1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EU\"},{\"_key\":\"d521d0c6a9be2\",\"_type\":\"span\",\"marks\":[],\"text\":\"), all prices are inclusive of legally applicable VAT.\\nIf your order is being shipped to a country outside the EU, all prices are net prices excluding any taxes and/or shipping costs. You will see any taxes and shipping costs added at checkout, which may vary depending on the courier and destination.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0a3ef6d8cccb\",\"_type\":\"block\",\"children\":[{\"_key\":\"cb869d0049eb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"cb869d0049eb1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Currency\"},{\"_key\":\"cb869d0049eb2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe purchase price, shipping costs and any legally applicable tax, if any, are due without any deduction. All payments must be made in the currency shown on the Website. If your bank account is held in another currency, you bear the costs, if any, for currency exchanges to the currency shown on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"4ad158f2d58a\",\"_type\":\"block\",\"children\":[{\"_key\":\"5d0b5c2380350\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"5d0b5c2380351\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Payment options\"},{\"_key\":\"5d0b5c2380352\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou can pay for your purchase using a range of payment options indicated in the order process on our Website. Payment via one of these payment methods is processed via the secured payment service of our financial service provider which conforms to required security standards. Polaroid does not have access to this sensitive data.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Payment and prices\"},{\"_key\":\"3a7c1bd7c52b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"291b21755995\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b59a3135fd20\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Delivery service\"},{\"_key\":\"5b59a3135fd21\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe provide delivery services within the United Kingdom for all orders placed by from our United Kingdom website. For order placed from our EU \u0026 Rest of World website, we provide delivery services to most countries. Please find a list of notable exception on \"},{\"_key\":\"bb5d7e9ece12\",\"_type\":\"span\",\"marks\":[\"62ac56a19c1d\",\"c2f6bb564af5\"],\"text\":\"this page.\"}],\"markDefs\":[{\"_key\":\"62ac56a19c1d\",\"_type\":\"internalLink\"},{\"_key\":\"c2f6bb564af5\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/en-us/articles/115012406227-Which-countries-do-you-ship-to\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"e9fe5525e6ec\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc4096cd70c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1186a599992c\",\"_type\":\"block\",\"children\":[{\"_key\":\"6af0e61920640\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are not able to ship to PO boxes or service points since our chosen courier and shipment method requires a signature of receipt by the recipient for all deliveries.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ed195c54985b\",\"_type\":\"block\",\"children\":[{\"_key\":\"807e764881200\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8b6ede66332b\",\"_type\":\"block\",\"children\":[{\"_key\":\"d460232be3e70\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Courier \u0026 Shipping\"},{\"_key\":\"d460232be3e71\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nDelivery will be handled by a courier of our choice. We may offer options between different couriers and/or shipping methods. Unless stated otherwise, shipping costs will be borne by you and will depend on the weight of the ordered products, the selected shipping method, and the delivery address.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"750854a64c95\",\"_type\":\"block\",\"children\":[{\"_key\":\"53817b2351960\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9bf406e9f0f5\",\"_type\":\"block\",\"children\":[{\"_key\":\"cc809288e1a90\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do our very best to keep your shipping costs reasonable, but we only offer traceable courier services as all our products are highly fragile and should reach you in the best and fastest way possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a8c0af379eb9\",\"_type\":\"block\",\"children\":[{\"_key\":\"f6169fde29fb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f6169fde29fb1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Import\"},{\"_key\":\"f6169fde29fb2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWhen ordering from Polaroid, you are considered the importer of record and must comply with all laws and regulations of the country in which you will receive the products. You are responsible for assuring that the products can be lawfully imported to the destination country and for payment of possible import duties and possible handling fees. An exception applies for delivery to the United Kingdom, where Polaroid will act as the importer of record.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cb4f19bbdfe5\",\"_type\":\"block\",\"children\":[{\"_key\":\"c3f34bd9e8120\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"c3f34bd9e8121\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tracking order\"},{\"_key\":\"c3f34bd9e8122\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou will receive a shipping confirmation email with a tracking number as soon as your order has been shipped. This is the most accurate way to check up on your order.\\nYou can also see the status of your order by logging into your Polaroid account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"261702004b10\",\"_type\":\"block\",\"children\":[{\"_key\":\"59437d8fec3d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"59437d8fec3d1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Damage during shipment\"},{\"_key\":\"59437d8fec3d2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nShould your shipment arrive at your delivery address damaged, please do not accept the shipment, or have the courier confirm the damage. Since courier services will not accept damage complaints that are filed at a later date, we will not be able to offer compensation or replacement in such cases.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0022687284f1\",\"_type\":\"block\",\"children\":[{\"_key\":\"5e99f821a8880\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"efe36aea704b\",\"_type\":\"block\",\"children\":[{\"_key\":\"cab457278d8f0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Reporting Missing or\"},{\"_key\":\"cab457278d8f1\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"},{\"_key\":\"cab457278d8f2\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Incorrect Deliveries\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"35b340418243\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce3acc51594c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please inspect your order upon receipt. If you believe that any item is missing from your order, that an incorrect item has been delivered, or that a delivery has been missed, failed, or otherwise not completed in accordance with your order, you must report this to our customer support team within 10 days of the date on which you receive the packaging (or, if no packaging is delivered, within 10 days of the date on which delivery was scheduled). Reports should include sufficient details to identify the order (such as order number and item description) and a clear description of the issue. If you do not report missing, incorrect, or failed deliveries within this 10-day period, we may be unable to accept your claim or provide replacement items. Customer support can be contacted via the contact details set out in these Terms.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Delivery and shipment\"},{\"_key\":\"d1dd01af4b89\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ad3b8d4e52c0\",\"_type\":\"block\",\"children\":[{\"_key\":\"2dbc22b4c7130\",\"_type\":\"span\",\"marks\":[],\"text\":\"Property in the products passes at the time of delivery to you or to a third party indicated by you. At the same time the risk of deterioration in the products passes to you. Any products delivered to you or to a third party indicated by you remain Polaroid’s property until they have been fully paid for. You or such third party indicated by you are/is obligated to handle the products with due care until title in them has been transferred to you or such third party indicated by you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Title to the products\"},{\"_key\":\"eef66e4b83d4\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b70a54873af5\",\"_type\":\"block\",\"children\":[{\"_key\":\"9d612b0dbf2c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return period\"},{\"_key\":\"9d612b0dbf2c1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe have a standard 14-day return policy for all purchases made through our online shop. If you are dissatisfied with your purchase for any reason, you may return it for a full refund within 14 days of receiving the product(s).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b3a9cf426042\",\"_type\":\"block\",\"children\":[{\"_key\":\"783975d2a1660\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"783975d2a1661\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return conditions\"},{\"_key\":\"783975d2a1662\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nTo be eligible for a return, your product must be in the same condition as received, so unused and unopened with all original packaging and documentation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b44905ed86bb\",\"_type\":\"block\",\"children\":[{\"_key\":\"f1eb5a66c9670\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f1eb5a66c9671\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"How to return\"},{\"_key\":\"f1eb5a66c9672\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nAll returns are handled on a case-by-case basis: you will need to get in touch with us via email service@polaroid.com. Please provide your order ID in the message.\\nAll returns need to be authorized by the customer support team. They will provide an RMA number and return address which is needed for the return process. Returns without a valid RMA number may not be processed and may delay any replacement or refund. After notifying us, you must send the product(s) back to us no later than 14 days from the date on which you informed us of your decision to return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"28866dc16a1e\",\"_type\":\"block\",\"children\":[{\"_key\":\"602ca343d6120\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"602ca343d6121\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Shipment return\"},{\"_key\":\"602ca343d6122\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are shipping back one of our products, you should consider using a trackable shipping service or purchasing shipping insurance. We do not guarantee that we will receive your returned item.\\nYou are responsible for the shipping costs of your return shipment and bear the risk of loss of the return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"de25560f1f7f\",\"_type\":\"block\",\"children\":[{\"_key\":\"caeab10ca1c00\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"caeab10ca1c01\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Approval or rejection return\"},{\"_key\":\"caeab10ca1c02\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nOnce your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ac94e10e9b6f\",\"_type\":\"block\",\"children\":[{\"_key\":\"d7aa95f4b1560\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"d7aa95f4b1561\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refund\"},{\"_key\":\"d7aa95f4b1562\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are approved, you will be credited the full purchase price paid for the returned products including our initial shipping charge. It will take some days before you will see payment on your bank account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2339ff9c829d\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a2cf2ede0ce0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"4a2cf2ede0ce1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Defective products\"},{\"_key\":\"4a2cf2ede0ce2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe above applies primarily to unwanted products, as opposed to products which are exhibiting a manufacturing defect. If you have purchased products through our online shop which you believe are defective in any way, please get in touch and your claim will be evaluated under our limited warranty. For full details regarding our product warranty, please see our \"},{\"_key\":\"b1ee09a1a739\",\"_type\":\"span\",\"marks\":[\"04f6ebd640f4\"],\"text\":\"warranty policy\"},{\"_key\":\"be03a035d43c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"04f6ebd640f4\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"94a2f569-9a06-4cf4-856b-90228741a6ce\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"eff8abbc2300\",\"_type\":\"block\",\"children\":[{\"_key\":\"e9d936df57850\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIn case the defective product was bought from an authorized reseller, please contact such reseller for its warranty service. In case you might have problems to find a solution with such authorized reseller, you may contact our customer service.\\n\\n\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Returns\"},{\"_key\":\"e5e18b5d29a7\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"d0ec8bdd422f\",\"_type\":\"block\",\"children\":[{\"_key\":\"179165a9e5620\",\"_type\":\"span\",\"marks\":[],\"text\":\"From time to time, we will offer special promotions in our web shop.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e24c6eb5a3a7\",\"_type\":\"block\",\"children\":[{\"_key\":\"4ac958e3f0cd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"58e19018542e\",\"_type\":\"block\",\"children\":[{\"_key\":\"268bfe099f330\",\"_type\":\"span\",\"marks\":[],\"text\":\"The promotions will be running for a limited period of time. The exact term of the promotions will be mentioned on our Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5407e6c25715\",\"_type\":\"block\",\"children\":[{\"_key\":\"e6d0c567354a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"3e5ba0c55ef6\",\"_type\":\"block\",\"children\":[{\"_key\":\"b7dd7ee2eab00\",\"_type\":\"span\",\"marks\":[],\"text\":\"During our promotions special discounts will apply and will only be valid during the limited term of the promotions.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e4d2262f3572\",\"_type\":\"block\",\"children\":[{\"_key\":\"73d8d6882ff30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[] the European Union (\"},{\"_key\":\"880e3b65d8c31\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EU\"},{\"_key\":\"880e3b65d8c32\",\"_type\":\"span\",\"marks\":[],\"text\":\"), all prices are inclusive of legally applicable VAT.\\nIf your order is being shipped to a country outside the EU, all prices are net prices excluding any taxes and/or shipping costs. You will see any taxes and shipping costs added at checkout, which may vary depending on the courier and destination.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"52c152f03e33\",\"_type\":\"block\",\"children\":[{\"_key\":\"ede72c6a8fa20\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"ede72c6a8fa21\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Currency\"},{\"_key\":\"ede72c6a8fa22\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe purchase price, shipping costs and any legally applicable tax, if any, are due without any deduction. All payments must be made in the currency shown on the Website. If your bank account is held in another currency, you bear the costs, if any, for currency exchanges to the currency shown on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1190659c585f\",\"_type\":\"block\",\"children\":[{\"_key\":\"90a693b3d90c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"90a693b3d90c1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Payment options\"},{\"_key\":\"90a693b3d90c2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou can pay for your purchase using a range of payment options indicated in the order process on our Website. Payment via one of these payment methods is processed via the secured payment service of our financial service provider which conforms to required security standards. Polaroid does not have access to this sensitive data.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Payment and prices\"},{\"_key\":\"7d3e09b36147\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"5cb4c1ebd60d\",\"_type\":\"block\",\"children\":[{\"_key\":\"7b344357b5cd0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Delivery service\"},{\"_key\":\"7b344357b5cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe provide delivery services within the United Kingdom for all orders placed by from our United Kingdom website. For order placed from our EU \u0026 Rest of World website, we provide delivery services to most countries. Please find a list of notable exception \"},{\"_key\":\"4edbed20de13\",\"_type\":\"span\",\"marks\":[\"88698bcdb4cb\"],\"text\":\"here\"},{\"_key\":\"cfb086a6ba80\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"88698bcdb4cb\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/en-us/articles/115012406227-Which-countries-do-you-ship-to\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"d0c7d80f657a\",\"_type\":\"block\",\"children\":[{\"_key\":\"b381c60d15840\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"01d5dea75969\",\"_type\":\"block\",\"children\":[{\"_key\":\"4459f273a4d60\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are not able to ship to PO boxes or service points since our chosen courier and shipment method requires a signature of receipt by the recipient for all deliveries.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"761160d3c5ad\",\"_type\":\"block\",\"children\":[{\"_key\":\"05fe0e15b7660\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"39724cfa3567\",\"_type\":\"block\",\"children\":[{\"_key\":\"f29169ae9b790\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Courier \u0026 Shipping\"},{\"_key\":\"f29169ae9b791\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nDelivery will be handled by a courier of our choice. We may offer options between different couriers and/or shipping methods. Unless stated otherwise, shipping costs will be borne by you and will depend on the weight of the ordered products, the selected shipping method, and the delivery address.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c70c14b13c14\",\"_type\":\"block\",\"children\":[{\"_key\":\"4dcb5345c8eb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dbb591c60418\",\"_type\":\"block\",\"children\":[{\"_key\":\"8f2f1334f8880\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do our very best to keep your shipping costs reasonable, but we only offer traceable courier services as all our products are highly fragile and should reach you in the best and fastest way possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f9ccdb48625f\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9fadd8907200\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f9fadd8907201\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Import\"},{\"_key\":\"f9fadd8907202\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWhen ordering from Polaroid, you are considered the importer of record and must comply with all laws and regulations of the country in which you will receive the products. You are responsible for assuring that the products can be lawfully imported to the destination country and for payment of possible import duties and possible handling fees. An exception applies for delivery to the United Kingdom, where Polaroid will act as the importer of record.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9fdb961287c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"c73ccd5db59b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"c73ccd5db59b1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tracking order\"},{\"_key\":\"c73ccd5db59b2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou will receive a shipping confirmation email with a tracking number as soon as your order has been shipped. This is the most accurate way to check up on your order.\\nYou can also see the status of your order by logging into your Polaroid account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cb9d0909b7a6\",\"_type\":\"block\",\"children\":[{\"_key\":\"3637ddb153dc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"3637ddb153dc1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Damage during shipment\"},{\"_key\":\"3637ddb153dc2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nShould your shipment arrive at your delivery address damaged, please do not accept the shipment, or have the courier confirm the damage. Since courier services will not accept damage complaints that are filed at a later date, we will not be able to offer compensation or replacement in such cases.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f59ea2a55772\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a4501b767760\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"3581a50667f7\",\"_type\":\"block\",\"children\":[{\"_key\":\"e9741a432c060\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Reporting Missing or\"},{\"_key\":\"e9741a432c061\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"},{\"_key\":\"e9741a432c062\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Incorrect Deliveries\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"16f66c44b9c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"0ec9d631e4920\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please inspect your order upon receipt. If you believe that any item is missing from your order, that an incorrect item has been delivered, or that a delivery has been missed, failed, or otherwise not completed in accordance with your order, you must report this to our customer support team within 10 days of the date on which you receive the packaging (or, if no packaging is delivered, within 10 days of the date on which delivery was scheduled). Reports should include sufficient details to identify the order (such as order number and item description) and a clear description of the issue. If you do not report missing, incorrect, or failed deliveries within this 10-day period, we may be unable to accept your claim or provide replacement items. Customer support can be contacted via the contact details set out in these Terms.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Delivery and shipment\"},{\"_key\":\"ba8eaad87858\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"1fbdfc7d74e7\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a26de1ff81d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Property in the products passes at the time of delivery to you or to a third party indicated by you. At the same time the risk of deterioration in the products passes to you. Any products delivered to you or to a third party indicated by you remain Polaroid’s property until they have been fully paid for. You or such third party indicated by you are/is obligated to handle the products with due care until title in them has been transferred to you or such third party indicated by you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Title to the products\"},{\"_key\":\"a92eb29eda20\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"58d0eb4c0e72\",\"_type\":\"block\",\"children\":[{\"_key\":\"20af2eda35760\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return period\"},{\"_key\":\"20af2eda35761\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe have a standard 14-day return policy for all purchases made through our online shop. If you are dissatisfied with your purchase for any reason, you may return it for a full refund within 14 days of receiving the product(s).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"468f274e265b\",\"_type\":\"block\",\"children\":[{\"_key\":\"6640264dc25c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"6640264dc25c1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return conditions\"},{\"_key\":\"6640264dc25c2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nTo be eligible for a return, your product must be in the same condition as received, so unused and unopened with all original packaging and documentation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"392f5c29b5c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce5e29536be90\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"ce5e29536be91\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"How to return\"},{\"_key\":\"ce5e29536be92\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nAll returns are handled on a case-by-case basis: you will need to get in touch with us via email service@polaroid.com. Please provide your order ID in the message.\\nAll returns need to be authorized by the customer support team. They will provide an RMA number and return address which is needed for the return process. Returns without a valid RMA number may not be processed and may delay any replacement or refund. After notifying us, you must send the product(s) back to us no later than 14 days from the date on which you informed us of your decision to return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"74fa049d55d9\",\"_type\":\"block\",\"children\":[{\"_key\":\"453b278037e30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"453b278037e31\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Shipment return\"},{\"_key\":\"453b278037e32\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are shipping back one of our products, you should consider using a trackable shipping service or purchasing shipping insurance. We do not guarantee that we will receive your returned item.\\nYou are responsible for the shipping costs of your return shipment and bear the risk of loss of the return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d9413764387e\",\"_type\":\"block\",\"children\":[{\"_key\":\"b0730402a9060\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"b0730402a9061\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Approval or rejection return\"},{\"_key\":\"b0730402a9062\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nOnce your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"aacd45eca0e0\",\"_type\":\"block\",\"children\":[{\"_key\":\"a948b52d0dc30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"a948b52d0dc31\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refund\"},{\"_key\":\"a948b52d0dc32\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are approved, you will be credited the full purchase price paid for the returned products including our initial shipping charge. It will take some days before you will see payment on your bank account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7fca52fe05ff\",\"_type\":\"block\",\"children\":[{\"_key\":\"e98cf27823580\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"e98cf27823581\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Defective products\"},{\"_key\":\"e98cf27823582\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe above applies primarily to unwanted products, as opposed to products which are exhibiting a manufacturing defect. If you have purchased products through our online shop which you believe are defective in any way, please get in touch and your claim will be evaluated under our limited warranty. For full details regarding our product warranty, please see our \"},{\"_key\":\"8bbdbd348fcc\",\"_type\":\"span\",\"marks\":[\"b6428d0c2587\"],\"text\":\"warranty policy\"},{\"_key\":\"df6fa259070d\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"b6428d0c2587\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"94a2f569-9a06-4cf4-856b-90228741a6ce\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"f15a367c0bcf\",\"_type\":\"block\",\"children\":[{\"_key\":\"605e28f2537a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIn case the defective product was bought from an authorized reseller, please contact such reseller for its warranty service. In case you might have problems to find a solution with such authorized reseller, you may contact our customer service.\\n\\n\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Returns\"},{\"_key\":\"3b69239dd901\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"c1aca1cfa0f5\",\"_type\":\"block\",\"children\":[{\"_key\":\"06a4e9ec5dd80\",\"_type\":\"span\",\"marks\":[],\"text\":\"From time to time, we will offer special promotions in our web shop.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"222cff6ea5a0\",\"_type\":\"block\",\"children\":[{\"_key\":\"d15df4bc284d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5644baa07a80\",\"_type\":\"block\",\"children\":[{\"_key\":\"5a897f26da540\",\"_type\":\"span\",\"marks\":[],\"text\":\"The promotions will be running for a limited period of time. The exact term of the promotions will be mentioned on our Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6de7998fffb1\",\"_type\":\"block\",\"children\":[{\"_key\":\"e4d5afda3e960\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f4384062f375\",\"_type\":\"block\",\"children\":[{\"_key\":\"02ccabc40f980\",\"_type\":\"span\",\"marks\":[],\"text\":\"During our promotions special discounts will apply and will only be valid during the limited term of the promotions.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"56f5438b9de3\",\"_type\":\"block\",\"children\":[{\"_key\":\"1d846a47b3320\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b1c4220bcb7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"20b56108c8f30\",\"_type\":\"span\",\"marks\":[],\"text\":\"The special discounts cannot be used in conjunction with any other discount.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2026ee33e1b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"317b9ec90f7b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e3e81db55fdd\",\"_type\":\"block\",\"children\":[{\"_key\":\"25c711f8da760\",\"_type\":\"span\",\"marks\":[],\"text\":\"The applicable discounts and the participating sales items will be shown on our Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"aeeb555db235\",\"_type\":\"block\",\"children\":[{\"_key\":\"a982ce75b27f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f595b2a80216\",\"_type\":\"block\",\"children\":[{\"_key\":\"f040d81d65980\",\"_type\":\"span\",\"marks\":[],\"text\":\"We reserve our right to exclude particular items from our promotions.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"16e53662567d\",\"_type\":\"block\",\"children\":[{\"_key\":\"6b8da67f09390\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2740a7c7f102\",\"_type\":\"block\",\"children\":[{\"_key\":\"17f77b75d3f80\",\"_type\":\"span\",\"marks\":[],\"text\":\"The discounts shown might be not the exact discount but only the approximate discount.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"42a154eba31c\",\"_type\":\"block\",\"children\":[{\"_key\":\"b4e67e54366b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"23842063fe3f\",\"_type\":\"block\",\"children\":[{\"_key\":\"71d75fe254130\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will reflect the exact price difference in the “to” and “from” price.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0ca22e9bce5a\",\"_type\":\"block\",\"children\":[{\"_key\":\"caa8df4f82a40\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a8c37fee4f13\",\"_type\":\"block\",\"children\":[{\"_key\":\"517641191bdc0\",\"_type\":\"s ,\"text\":\"We provide delivery services within the United States and Canada for all order placed from our US \u0026 Canada online shop.We are not able to ship to PO boxes or service points since our chosen courier and shipment method requires a signature of receipt by the recipient for all deliveries.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1ff75f450154\",\"_type\":\"block\",\"children\":[{\"_key\":\"b2616dd291d20\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b04503cc0124\",\"_type\":\"block\",\"children\":[{\"_key\":\"60decfd227420\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Carrier\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"889809434626\",\"_type\":\"block\",\"children\":[{\"_key\":\"a563bfbe07820\",\"_type\":\"span\",\"marks\":[],\"text\":\"Delivery will be made via a carrier of our choice. We reserve the right to offer a choice between different carriers and/or shipping methods. Unless stated otherwise, you will bear the shipping costs which depend on the weight of the ordered products, the shipping method, and the delivery address. We do our very best to keep your shipping costs within a reasonable range, but we only offer traceable courier services as all our products are highly fragile and should reach you in the best and fastest way possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0091f4674295\",\"_type\":\"block\",\"children\":[{\"_key\":\"acebd0e826910\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e2984fcaf264\",\"_type\":\"block\",\"children\":[{\"_key\":\"e94711254b640\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Import\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fc016fcaff06\",\"_type\":\"block\",\"children\":[{\"_key\":\"cf968ceeedc70\",\"_type\":\"span\",\"marks\":[],\"text\":\"For orders placed through our Website for delivery to Canada, Polaroid will act as importer of record and manage the payment of import duties, taxes and other fees associated with the importation process. These costs will be calculated at check-out and paid for by you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ca9799ef645e\",\"_type\":\"block\",\"children\":[{\"_key\":\"0f345d5deeb40\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0515eff5993e\",\"_type\":\"block\",\"children\":[{\"_key\":\"f752d101627e0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tracking order\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b85a67fc078a\",\"_type\":\"block\",\"children\":[{\"_key\":\"fddc61b566170\",\"_type\":\"span\",\"marks\":[],\"text\":\"You will receive a shipping confirmation email with a tracking number as soon as your order has been shipped. This is the most accurate way to check up on your order.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"382b5301c6c8\",\"_type\":\"block\",\"children\":[{\"_key\":\"d668361534c60\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can also see the status of your order by logging into your Polaroid account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"97ed1e406b11\",\"_type\":\"block\",\"children\":[{\"_key\":\"1aa29cbee1de0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1e2811502002\",\"_type\":\"block\",\"children\":[{\"_key\":\"53a16b3005e40\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Damage during shipment\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2e8f9654c627\",\"_type\":\"block\",\"children\":[{\"_key\":\"f825d6abee320\",\"_type\":\"span\",\"marks\":[],\"text\":\"Should your shipment arrive at your delivery address damaged, please do not accept the shipment, or have the courier confirm the damage. Since courier services will not accept damage complaints that are filed at a later date, we will not be able to offer compensation or replacement in such cases.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"61057ed3b8c0\",\"_type\":\"block\",\"children\":[{\"_key\":\"657b2066979d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1d4e5e997193\",\"_type\":\"block\",\"children\":[{\"_key\":\"21fc48bb31720\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Reporting Missing or\"},{\"_key\":\"21fc48bb31721\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"},{\"_key\":\"21fc48bb31722\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Incorrect Deliveries\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"766a3325a0f4\",\"_type\":\"block\",\"children\":[{\"_key\":\"7e72318f60150\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please inspect your order upon receipt. If you believe that any item is missing from your order, that an incorrect item has been delivered, or that a delivery has been missed, failed, or otherwise not completed in accordance with your order, you must report this to our sustomer support team within 10 days of the date on which you receive the packaging (or, if no packaging is delivered, within 10 days of the date on which delivery was scheduled). Reports should include sufficient details to identify the order (such as order number and item description) and a clear description of the issue. If you do not report missing, incorrect, or failed deliveries within this 10-day period, we may be unable to accept your claim or provide replacement items. Customer support can be contacted via the contact details set out in these Terms.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"41297c69cc8d\",\"_type\":\"block\",\"children\":[{\"_key\":\"c75c82613c130\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Delivery and shipment\"},{\"_key\":\"7912dd92d6a9\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"1f1da61abda5\",\"_type\":\"block\",\"children\":[{\"_key\":\"72535ea613790\",\"_type\":\"span\",\"marks\":[],\"text\":\"Property in the products passes at the time of delivery to you or to a third party indicated by you. At the same time the risk of deterioration in the products passes to you. Any products delivered to you or to a third party indicated by you remain Polaroid’s property until they have been fully paid for. You or such third party indicated by you are/is obligated to handle the products with due care until title in them has been transferred to you or such third party indicated by you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Title to the products\"},{\"_key\":\"962322576c7b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"02fa0918c887\",\"_type\":\"block\",\"children\":[{\"_key\":\"77d35df32d990\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return period\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"27f713417bd8\",\"_type\":\"block\",\"children\":[{\"_key\":\"4b0dea2b03de0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We have a standard 14-day return policy for all purchases made from our Website. If you are dissatisfied with your purchase for any reason, you may return it for a full refund within 14 days of receiving the product(s).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a37a8731bc41\",\"_type\":\"block\",\"children\":[{\"_key\":\"a9eeec1022830\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"98309f670a02\",\"_type\":\"block\",\"children\":[{\"_key\":\"6e738c60b2220\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return conditions\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f6bde59814f0\",\"_type\":\"block\",\"children\":[{\"_key\":\"279ee540c2290\",\"_type\":\"span\",\"marks\":[],\"text\":\"To be eligible for a return, your product must be in the same condition as received, so unused and unopened with all original packaging and documentation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"3fb652c26357\",\"_type\":\"block\",\"children\":[{\"_key\":\"bf82aae287740\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0f8fddffd8cd\",\"_type\":\"block\",\"children\":[{\"_key\":\"35897bcd33ad0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"How to return\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5d8db1ab6e13\",\"_type\":\"block\",\"children\":[{\"_key\":\"bb8e972571c30\",\"_type\":\"span\",\"marks\":[],\"text\":\"All returns are handled on a case-by-case basis: you will need to get in touch with us via email service@polaroid.com. Please provide your order ID in the message.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a766e6c92da0\",\"_type\":\"block\",\"children\":[{\"_key\":\"01803d5690f60\",\"_type\":\"span\",\"marks\":[],\"text\":\"All returns need to be authorized by the customer support team. They will provide an RMA number and return address which is needed for the return process. Returns without a valid RMA number may not be processed and may delay any replacement or refund. After notifying us, you must send the product(s) back to us no later than 14 days from the date on which you informed us of your decision to return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"97bc224f2999\",\"_type\":\"block\",\"children\":[{\"_key\":\"25aa46087c370\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"67e6ba5d9765\",\"_type\":\"block\",\"children\":[{\"_key\":\"a623e54779380\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Shipment return\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a8b9196ba3a4\",\"_type\":\"block\",\"children\":[{\"_key\":\"37ff4a6288f10\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you are shipping back one of our products, you should consider using a trackable shipping service or purchasing shipping insurance. We do not guarantee that we will receive your returned item. You are responsible for the shipping costs of your return shipment and bear the risk of loss of the return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c6e10b313a7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"ad20365f53b60\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dbf9ce9241b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"1abfbc33da690\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Approval or rejection return\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d54037362ec0\",\"_type\":\"block\",\"children\":[{\"_key\":\"a9f9d1daf84b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"deca189599ae\",\"_type\":\"block\",\"children\":[{\"_key\":\"d069c32076280\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a9c2218c3353\",\"_type\":\"block\",\"children\":[{\"_key\":\"0d82000b14680\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refund\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"688565f7cdc4\",\"_type\":\"block\",\"children\":[{\"_key\":\"f8703d8f4fc50\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you are approved, you will be credited the full purchase price paid for the returned products including our initial shipping charge. It will take some days before you will see payment on your bank account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2923a64ab9a7\",\"_type\":\"block\",\"children\":[{\"_key\":\"9bd3d748ecf20\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b658ef674e48\",\"_type\":\"block\",\"children\":[{\"_key\":\"f732fa10f42c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Defective products\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1ed1990a02ec\",\"_type\":\"block\",\"children\":[{\"_key\":\"ec3e8a4930 ery service for Polaroid Film that you set up during checkout. You choose the frequency of delivery (every 4, 8 or 12 weeks). You can skip a delivery, or cancel your Subscription at any time, without notice or reason.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"2. What is the Polaroid Film Subscription?\"},{\"_key\":\"bb297ff8a0f1\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"bb309d387800\",\"_type\":\"block\",\"children\":[{\"_key\":\"104db350c1ad0\",\"_type\":\"span\",\"marks\":[],\"text\":\"By setting up the Polaroid Film Subscription, you ensure that you never run out of Polaroid Film, and you’ll receive the following benefits:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ec44a179d8f1\",\"_type\":\"block\",\"children\":[{\"_key\":\"708e801bb07e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"free shipping on all subscribtion orders\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8602d234cc00\",\"_type\":\"block\",\"children\":[{\"_key\":\"2b8cc86949770\",\"_type\":\"span\",\"marks\":[],\"text\":\"a 5% discount on every subscription order from the second shipment onwards.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. What is the benefit of the Polaroid Film Subscription? \"},{\"_key\":\"48306bdfa950\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"6e95e8f7a812\",\"_type\":\"block\",\"children\":[{\"_key\":\"fc624ca309660\",\"_type\":\"span\",\"marks\":[],\"text\":\"Only selected i-Type Film Bundles and Polaroid Go Film Bundles marked as Available for Subscription on our product page at \"},{\"_key\":\"769f1d7e4263\",\"_type\":\"span\",\"marks\":[\"7159386299e3\"],\"text\":\"https://www.polaroid.com/en_us/film/film-subscription\"},{\"_key\":\"115d4ecd975d\",\"_type\":\"span\",\"marks\":[],\"text\":\" are eligible.\"}],\"markDefs\":[{\"_key\":\"7159386299e3\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_us/film/film-subscription\"}],\"styl 5b-06ad936423ba\",\"rev\":\"bxVjxkb6qtgL81APFjU6Rw\"}},\"_type\":\"policiesPage\",\"_updatedAt\":\"2025-08-13T08:40:50Z\",\"blocks\":[{\"_key\":\"657723944d24\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"a6b8b1a95d69\",\"_type\":\"block\",\"children\":[{\"_key\":\"2304a587047a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"These terms and conditions (the “\"},{\"_key\":\"8e50131910c3\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Membership Terms\"},{\"_key\":\"e6026a431a2a\",\"_type\":\"span\",\"marks\":[],\"text\":\"”) govern participation in the Polaroid membership reward program (the “\"},{\"_key\":\"8ae383e09ab0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Polaroid Membership Program\"},{\"_key\":\"36381ed914fc\",\"_type\":\"span\",\"marks\":[],\"text\":\"”) set up and managed by Polaroid International B.V., with registered address at Danzigerkade 16c, 1013 AP Amsterdam, The Netherlands, registered with the Dutch Chamber of Commerce under no. 59065982, and a subsidiary of Polaroid B.V. (together with its affiliates, “Polaroid” or “we”).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9ec36890fd85\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a87aa04afe50\",\"_type\":\"span\",\"marks\":[],\"text\":\"The Polaroid Membership Program allows members to earn membership reward points (“Points”) to benefit from in accordance with these Membership Terms.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"1. General\"},{\"_key\":\"4906073a6fab\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"5b310ad6648c\",\"_type\":\"block\",\"children\":[{\"_key\":\"5c1b5feed4bd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"By creating a Polaroid account on the website of polaroid.com or within the Polaroid App you consent to becoming a member in the Polaroid Membership Program. Your personal data will be processed in accordance with our \"},{\"_key\":\"b081108da10b\",\"_type\":\"span\",\"marks\":[\"63611b78c9c2\"],\"text\":\"Privacy Policy\"},{\"_key\":\"1b1ab8b6416e\",\"_type\":\"span\",\"marks\":[],\"text\":\". Once you have created your account, you are automatically enrolled in the Polaroid Membership Program, and are a member.\"}],\"markDefs\":[{\"_key\":\"63611b78c9c2\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"de7772dc4708\",\"_type\":\"block\",\"children\":[{\"_key\":\"ed7b79baa9d10\",\"_type\":\"span\",\"marks\":[],\"text\":\"By being a member, you will be able to earn Points which you can redeem for discounts and other perks. You will also have access to Member exclusive content, and you gain access to exclusive offers.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0b1550e14649\",\"_type\":\"block\",\"children\":[{\"_key\":\"0e264c6dbc4a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Membership in the Polaroid Membership Program is free. No purchase is necessary to obtain membership.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"96efd5634976\",\"_type\":\"block\",\"children\":[{\"_key\":\"d757206dad530\",\"_type\":\"span\",\"marks\":[],\"text\":\"You are only allowed to hold one account per natural person. Persons who are discovered to have more than one account forfeit their Points and will be unsubscribed from the Polaroid Membership Program.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ab0b4b4a83fc\",\"_type\":\"block\",\"children\":[{\"_key\":\"29c036acd38b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to \"},{\"_key\":\"562f53a911e7\",\"_type\":\"span\",\"marks\":[\"3f9cf77c656a\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"af5d46381f74\",\"_type\":\"span\",\"marks\":[],\"text\":\" or use \"},{\"_key\":\"2900ccac7db6\",\"_type\":\"span\",\"marks\":[\"abd895e65242\"],\"text\":\"our form\"},{\"_key\":\"fd56b735a214\",\"_type\":\"span\",\"marks\":[],\"text\":\". If you delete your account, you will lose your Points and other perks of the Polaroid Membership Program. Deleting your Polaroid account does not automatically result in the removal of any content you have submitted through the Creative Calls feature in the Polaroid App. If you wish to request the removal of your submitted content, you can do so by contacting us at \"},{\"_key\":\"60c0bdbfd7c9\",\"_type\":\"span\",\"marks\":[\"fc180337bc0b\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"05672bbf4ead\",\"_type\":\"span\",\"marks\":[],\"text\":\" or use \"},{\"_key\":\"7c19fddfcd39\",\"_type\":\"span\",\"marks\":[\"45854407d9ce\"],\"text\":\"our form\"},{\"_key\":\"5cd245149923\",\"_type\":\"span\",\"marks\":[],\"text\":\". For more information about how we handle and retain data, we refer to our \"},{\"_key\":\"eda4170d8c78\",\"_type\":\"span\",\"marks\":[\"4f63eaf09781\"],\"text\":\"Privacy Policy\"},{\"_key\":\"d341d44432eb\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"45854407d9ce\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/requests/new?tf_360020994779=account_query\u0026ticket_form_id=360001906579\",\"targetNewWindow\":true},{\"_key\":\"fc180337bc0b\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"},{\"_key\":\"3f9cf77c656a\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"},{\"_key\":\"4f63eaf09781\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}},{\"_key\":\"abd895e65242\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/requests/new?tf_360020994779=account_query\u0026ticket_form_id=360001906579\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"2. Membership\"},{\"_key\":\"0efefec93574\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"500481a1f9a2\",\"_type\":\"block\",\"children\":[{\"_key\":\"6d7d6689614a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Persons eligible for membership are limited to those natural persons who are at least 18 years of age. If you are under 18, you may only use the Polaroid Membership Program with the permission of a legal representative.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9b8aba6f3b09\",\"_type\":\"block\",\"children\":[{\"_key\":\"41cb14ba22080\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may refuse admission to any person who does not meet the requirements pertaining to the Polaroid Membership Program. We are not required to provide any reason in case of denial of membership.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Eligibility\"},{\"_key\":\"e44370121217\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"4ec2a667c56a\",\"_type\":\"block\",\"children\":[{\"_key\":\"4707ced2f5880\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can earn Points with every purchase on polaroid.com. To receive Points, you must log into your Polaroid account. For every €1 or $1 (or the equivalent in your local currency - exchange rates apply) you spend on purchases, you earn 1 Point. Points are added to your account once the order is fulfilled.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6e318f7d26b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce35cbc5e2a70\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points are based on your order total after deduction of any discount codes (including discount codes for gift cards), but including taxes and shipping costs.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"47a6b9a650d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"ca020bf702290\",\"_type\":\"span\",\"marks\":[],\"text\":\"To the extent you are taking part in Creative Calls via the Polaroid App, you earn 5 Points for each time you participate.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"002bc131f97f\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b5ad1f7a4e20\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can also earn Points for certain interactions, including but not limited to welcome Points and referral Points. These interactions and the number of Points eligible for each interaction will be set out on your account. When you click on “Earn Points” you will see the list with interactions with us and their associated Points. We may change, discontinue, or add interactions where you can earn Points and change the number of Points earned in our sole discretion and without prior notification.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1d5e61283e5e\",\"_type\":\"block\",\"children\":[{\"_key\":\"72b670cc385b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points earned for a purchase that is then the subject of a return, cancellation, refund or declined credit card, or other credit will be deducted from your account in an amount equal to the Points earned for the original transaction.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Earning Points\"},{\"_key\":\"d1952ce28c59\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"cd13281d203d\",\"_type\":\"block\",\"children\":[{\"_key\":\"462e928c80d10\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points must be used in increments outlined in these Membership Terms. The maximum number of Points that may be used in a single transaction is 550 Points.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"66a2dcf0edfd\",\"_type\":\"block\",\"children\":[{\"_key\":\"b5047ede666d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can redeem Points by clicking on the tab “My Feed” on your account. Next, click on any available item under \\\"Rewards\\\".\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"49ca34b62ed2\",\"_type\":\"block\",\"children\":[{\"_key\":\"d7aae9e820320\",\"_type\":\"span\",\"marks\":[],\"text\":\"When you want to redeem any of the available coupons under “Rewards” you will see a list of coupon values and their associated cost in Points.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"198337f422da\",\"_type\":\"block\",\"children\":[{\"_key\":\"06340dc205620\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can choose the amount of Points you want to redeem and receive a coupon code immediately that you can use. You will get a confirmation of the coupon code in your e-mail, which you can use during the checkout procedure in the field marked “discount”.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bad7b1d5a3c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"af843f17097f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Discount codes are non-transferable. They can only be used by the account that redeemed the Points and received the code. You are required to be logged into your account in order to use the discount code within the checkout process.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"85c939f63ba1\",\"_type\":\"block\",\"children\":[{\"_key\":\"a5abd300633a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can use only one discount code per transaction. Reward discount codes may not be combined with other discount codes. Points accumulated on different accounts by different members may not be combined or aggregated to make purchases of products or for any other reason.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Use of Points to Spend\"},{\"_key\":\"5aa4c19123a6\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"dc4ee26a01c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"3aa5714b98fc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"The Polaroid Membership Program has four separate levels: Level 1, Level 2, Level 3 and Level 4. You can move up through different level by earning Points. Your level is continuously recalculated based on your activity in the past year, relative to today's date. Please note that without recent purchases, your level may decrease as older points are no longer included in the calculation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"acd7b1e456f6\",\"_type\":\"block\",\"children\":[{\"_key\":\"5c1164b9d3e70\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 1\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"649b3fb8669c\",\"_type\":\"block\",\"children\":[{\"_key\":\"01419e84ed340\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 1 is the entry level for all Members.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5446cc6d1af3\",\"_type\":\"block\",\"children\":[{\"_key\":\"aa18f3bf1fb90\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 2\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48b0df00f4b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"40c98d067c290\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 2 is the level for Members between 200 and 1000 Points.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d0e52b6395ce\",\"_type\":\"block\",\"children\":[{\"_key\":\"5f5aa3f98a340\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 3\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5d69dc61b102\",\"_type\":\"block\",\"children\":[{\"_key\":\"75b9b51af79e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 3 is the level for Members with 1000 Points and 1500 Points.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f64cb757b408\",\"_type\":\"block\",\"children\":[{\"_key\":\"ac45eef377aa0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 4\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"17e7d83cad85\",\"_type\":\"block\",\"children\":[{\"_key\":\"6b08e029f7930\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 4 is the level for Members with 1500 Points and above.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b538ebbe7664\",\"_type\":\"block\",\"children\":[{\"_key\":\"314008482fa30\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can climb to a higher level by accumulating the number of Points mentioned above. When you proceed a level you will receive points as an entry reward. If level upgrades are achieved by acquiring Points through purchases of our products, we reserve the right to delay this upgrade for a period that is equal to the applicable return period for the purchased product.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Levels\"},{\"_key\":\"90322085720f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9711a6714d4f\",\"_type\":\"block\",\"children\":[{\"_key\":\"8ed57dbb16fd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"As long as the Polaroid Membership Program is in place, Points do not expire. However, points that are older than a year are not included in the calculation of your level.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dcd67f28296c\",\"_type\":\"block\",\"children\":[{\"_key\":\"bc91cc8394990\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once Points are redeemed and you have been assigned a discount code, we will not reapply the Points to your account.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"7. Expiration\"},{\"_key\":\"97bd29ecd810\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"4431cf8490d7\",\"_type\":\"block\",\"children\":[{\"_key\":\"a370d1b288d50\",\"_type\":\"span\",\"marks\":[],\"text\":\"The creation of a Polaroid account by you and the use of the Polaroid Membership Program implies your full acceptance of these Membership Terms, together with any and all rules and policies provided by us, including our \"},{\"_key\":\"e9537c1cdbfa\",\"_type\":\"span\",\"marks\":[\"c83ed029fccf\"],\"text\":\"Privacy Policy\"},{\"_key\":\"d63e2a0d5ca9\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"75b8b41fce53\",\"_type\":\"span\",\"marks\":[\"829a96ab6f00\"],\"text\":\"App Privacy Policy\"},{\"_key\":\"7410c5d9f6b9\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"c83ed029fccf\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}},{\"_key\":\"829a96ab6f00\",\"_type\":\"internalLink\",\"refer
