liability company, registered with the Netherlands Chamber of Commerce under no. 59065982, with its business address at Danzigerkade 16c, 1013 AP Amsterdam, The Netherlands (\"},{\"_key\":\"4e63f3b1a79d1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Polaroid, we or our\"},{\"_key\":\"4e63f3b1a79d2\",\"_type\":\"span\",\"marks\":[],\"text\":\").\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"699fbdee87de\",\"_type\":\"block\",\"children\":[{\"_key\":\"7b45c51deaae0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ed46e47afad6\",\"_type\":\"block\",\"children\":[{\"_key\":\"5a179018edde0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Contact\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2431e1435dbb\",\"_type\":\"block\",\"children\":[{\"_key\":\"d315dec286440\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can contact Polaroid at service@polaroid.com.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"1. About these terms of purchase\"},{\"_key\":\"cc3390116fdf\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"2d7e61b812bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"021a43f745cf0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Placing order\"},{\"_key\":\"021a43f745cf1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nBefore you can order products from our Website, you need to fill in some personal details, including your email address and shipping address. When you place your order, we will send you an email confirming receipt of your order and containing the details of your order.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d9cd2db88aec\",\"_type\":\"block\",\"children\":[{\"_key\":\"bdda465d3f720\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e6b8286e0959\",\"_type\":\"block\",\"children\":[{\"_key\":\"6eb2db43f98c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Processing order\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2fc624016cf2\",\"_type\":\"block\",\"children\":[{\"_key\":\"62a24906d1d60\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once we have processed and set up your order for delivery, we will send you a shippig confirmation email. We usually send the shipping confirmation email within one (1) working day after you place your order.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1b965a6b73d3\",\"_type\":\"block\",\"children\":[{\"_key\":\"da4a79d080920\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"96125536c29d\",\"_type\":\"block\",\"children\":[{\"_key\":\"137a9beb9f760\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Cancelling or changing order\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"554da9d12297\",\"_type\":\"block\",\"children\":[{\"_key\":\"17fbf67f72060\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once your order has been placed and processing has begun, it is not possible to cancel or make any changes to your order. Please double-check your order details carefully before completing your purchase.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b3af4fdd005a\",\"_type\":\"block\",\"children\":[{\"_key\":\"62de4761bdda0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"62de4761bdda1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refusing order\"},{\"_key\":\"62de4761bdda2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe reserve the right to refuse any order you place with us. We may limit or cancel quantities purchased per person, per household or per order, in our discretion. These restrictions may include orders placed by, or under the same customer account, the same credit card, and/or orders that use the same billing and/or shipping address. If we refuse or change your order, we will notify you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bf2826dbde03\",\"_type\":\"block\",\"children\":[{\"_key\":\"279542c9d2190\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"51cab8e3f0a2\",\"_type\":\"block\",\"children\":[{\"_key\":\"269afc58022c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"No reselling\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"554b2c589799\",\"_type\":\"block\",\"children\":[{\"_key\":\"c9218888f7210\",\"_type\":\"span\",\"marks\":[],\"text\":\"From our Website, we only sell products to end customers for private use. It is not permitted to use our Website to purchase products for resale or export to companies. We also reserve the right to limit or prohibit orders that, in our sole judgment, appear to be placed for resale or export.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6e92cfe0a1f3\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6810e2f7a240\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"a6810e2f7a241\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Minors\"},{\"_key\":\"a6810e2f7a242\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe do not sell goods for purchase by minors. If you are under 18 you may only order with the permission of a legal representative.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9bbedd368b44\",\"_type\":\"block\",\"children\":[{\"_key\":\"3f5510759e700\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2ab3046a462c\",\"_type\":\"block\",\"children\":[{\"_key\":\"958f125496720\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Availability products\"},{\"_key\":\"958f125496721\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe usually list unavailability information for out of stock products on the respective information page of those products. Beyond what we say on that page or elsewhere on the Website, we cannot be more specific about availability. As we process your order, we will inform you by email as soon as possible if any products you order turn out to be unavailable. You will not be charged for those products and if already charged, a refund shall be issued.\\n\\n\"},{\"_key\":\"958f125496722\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Accurate account\"},{\"_key\":\"958f125496723\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou agree to provide current, complete and accurate purchase and account information for all purchases made through our Website. You agree to promptly update your account and other information, including your email address and credit card numbers and expiration dates, so that we can complete your transactions and contact you as needed.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"65dddff8dd68\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc8d7b5155b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"1dc8d7b5155b1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Privacy\"},{\"_key\":\"1dc8d7b5155b2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nBy submitting orders you consent to the processing of personal data, such as name and title, address, telephone number, contact details and other personal details in accordance with the terms notified in our \"},{\"_key\":\"7b92d491ef27\",\"_type\":\"span\",\"marks\":[\"7c5faaa66e44\"],\"text\":\"privacy policy\"},{\"_key\":\"3db8f988271c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"7c5faaa66e44\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"2. Order\"},{\"_key\":\"97b0ed0dc3ca\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"151c6408ce43\",\"_type\":\"block\",\"children\":[{\"_key\":\"704ba19999660\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Prices\"},{\"_key\":\"704ba19999661\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nPrices for our products are subject to change without notice.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cd247e2a1ff1\",\"_type\":\"block\",\"children\":[{\"_key\":\"cbf5262b07b80\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"cbf5262b07b81\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Invoices\"},{\"_key\":\"cbf5262b07b82\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou consent to receive sales invoices electronically via email.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"193bc74627f2\",\"_type\":\"block\",\"children\":[{\"_key\":\"21e3d47e76da0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"21e3d47e76da1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tax\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0989a15506de\",\"_type\":\"block\",\"children\":[{\"_key\":\"d521d0c6a9be0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Within the European Union (\"},{\"_key\":\"d521d0c6a9be1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EU\"},{\"_key\":\"d521d0c6a9be2\",\"_type\":\"span\",\"marks\":[],\"text\":\"), all prices are inclusive of legally applicable VAT.\\nIf your order is being shipped to a country outside the EU, all prices are net prices excluding any taxes and/or shipping costs. You will see any taxes and shipping costs added at checkout, which may vary depending on the courier and destination.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0a3ef6d8cccb\",\"_type\":\"block\",\"children\":[{\"_key\":\"cb869d0049eb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"cb869d0049eb1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Currency\"},{\"_key\":\"cb869d0049eb2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe purchase price, shipping costs and any legally applicable tax, if any, are due without any deduction. All payments must be made in the currency shown on the Website. If your bank account is held in another currency, you bear the costs, if any, for currency exchanges to the currency shown on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"4ad158f2d58a\",\"_type\":\"block\",\"children\":[{\"_key\":\"5d0b5c2380350\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"5d0b5c2380351\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Payment options\"},{\"_key\":\"5d0b5c2380352\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou can pay for your purchase using a range of payment options indicated in the order process on our Website. Payment via one of these payment methods is processed via the secured payment service of our financial service provider which conforms to required security standards. Polaroid does not have access to this sensitive data.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Payment and prices\"},{\"_key\":\"3a7c1bd7c52b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"291b21755995\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b59a3135fd20\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Delivery service\"},{\"_key\":\"5b59a3135fd21\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe provide delivery services within the United Kingdom for all orders placed by from our United Kingdom website. For order placed from our EU \u0026 Rest of World website, we provide delivery services to most countries. Please find a list of notable exception on \"},{\"_key\":\"bb5d7e9ece12\",\"_type\":\"span\",\"marks\":[\"62ac56a19c1d\",\"c2f6bb564af5\"],\"text\":\"this page.\"}],\"markDefs\":[{\"_key\":\"62ac56a19c1d\",\"_type\":\"internalLink\"},{\"_key\":\"c2f6bb564af5\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/en-us/articles/115012406227-Which-countries-do-you-ship-to\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"e9fe5525e6ec\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc4096cd70c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1186a599992c\",\"_type\":\"block\",\"children\":[{\"_key\":\"6af0e61920640\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are not able to ship to PO boxes or service points since our chosen courier and shipment method requires a signature of receipt by the recipient for all deliveries.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ed195c54985b\",\"_type\":\"block\",\"children\":[{\"_key\":\"807e764881200\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8b6ede66332b\",\"_type\":\"block\",\"children\":[{\"_key\":\"d460232be3e70\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Courier \u0026 Shipping\"},{\"_key\":\"d460232be3e71\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nDelivery will be handled by a courier of our choice. We may offer options between different couriers and/or shipping methods. Unless stated otherwise, shipping costs will be borne by you and will depend on the weight of the ordered products, the selected shipping method, and the delivery address.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"750854a64c95\",\"_type\":\"block\",\"children\":[{\"_key\":\"53817b2351960\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9bf406e9f0f5\",\"_type\":\"block\",\"children\":[{\"_key\":\"cc809288e1a90\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do our very best to keep your shipping costs reasonable, but we only offer traceable courier services as all our products are highly fragile and should reach you in the best and fastest way possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a8c0af379eb9\",\"_type\":\"block\",\"children\":[{\"_key\":\"f6169fde29fb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f6169fde29fb1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Import\"},{\"_key\":\"f6169fde29fb2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWhen ordering from Polaroid, you are considered the importer of record and must comply with all laws and regulations of the country in which you will receive the products. You are responsible for assuring that the products can be lawfully imported to the destination country and for payment of possible import duties and possible handling fees. An exception applies for delivery to the United Kingdom, where Polaroid will act as the importer of record.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cb4f19bbdfe5\",\"_type\":\"block\",\"children\":[{\"_key\":\"c3f34bd9e8120\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"c3f34bd9e8121\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tracking order\"},{\"_key\":\"c3f34bd9e8122\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou will receive a shipping confirmation email with a tracking number as soon as your order has been shipped. This is the most accurate way to check up on your order.\\nYou can also see the status of your order by logging into your Polaroid account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"261702004b10\",\"_type\":\"block\",\"children\":[{\"_key\":\"59437d8fec3d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"59437d8fec3d1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Damage during shipment\"},{\"_key\":\"59437d8fec3d2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nShould your shipment arrive at your delivery address damaged, please do not accept the shipment, or have the courier confirm the damage. Since courier services will not accept damage complaints that are filed at a later date, we will not be able to offer compensation or replacement in such cases.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0022687284f1\",\"_type\":\"block\",\"children\":[{\"_key\":\"5e99f821a8880\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"efe36aea704b\",\"_type\":\"block\",\"children\":[{\"_key\":\"cab457278d8f0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Reporting Missing or\"},{\"_key\":\"cab457278d8f1\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"},{\"_key\":\"cab457278d8f2\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Incorrect Deliveries\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"35b340418243\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce3acc51594c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please inspect your order upon receipt. If you believe that any item is missing from your order, that an incorrect item has been delivered, or that a delivery has been missed, failed, or otherwise not completed in accordance with your order, you must report this to our customer support team within 10 days of the date on which you receive the packaging (or, if no packaging is delivered, within 10 days of the date on which delivery was scheduled). Reports should include sufficient details to identify the order (such as order number and item description) and a clear description of the issue. If you do not report missing, incorrect, or failed deliveries within this 10-day period, we may be unable to accept your claim or provide replacement items. Customer support can be contacted via the contact details set out in these Terms.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Delivery and shipment\"},{\"_key\":\"d1dd01af4b89\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ad3b8d4e52c0\",\"_type\":\"block\",\"children\":[{\"_key\":\"2dbc22b4c7130\",\"_type\":\"span\",\"marks\":[],\"text\":\"Property in the products passes at the time of delivery to you or to a third party indicated by you. At the same time the risk of deterioration in the products passes to you. Any products delivered to you or to a third party indicated by you remain Polaroid’s property until they have been fully paid for. You or such third party indicated by you are/is obligated to handle the products with due care until title in them has been transferred to you or such third party indicated by you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Title to the products\"},{\"_key\":\"eef66e4b83d4\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b70a54873af5\",\"_type\":\"block\",\"children\":[{\"_key\":\"9d612b0dbf2c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return period\"},{\"_key\":\"9d612b0dbf2c1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe have a standard 14-day return policy for all purchases made through our online shop. If you are dissatisfied with your purchase for any reason, you may return it for a full refund within 14 days of receiving the product(s).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b3a9cf426042\",\"_type\":\"block\",\"children\":[{\"_key\":\"783975d2a1660\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"783975d2a1661\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return conditions\"},{\"_key\":\"783975d2a1662\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nTo be eligible for a return, your product must be in the same condition as received, so unused and unopened with all original packaging and documentation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b44905ed86bb\",\"_type\":\"block\",\"children\":[{\"_key\":\"f1eb5a66c9670\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f1eb5a66c9671\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"How to return\"},{\"_key\":\"f1eb5a66c9672\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nAll returns are handled on a case-by-case basis: you will need to get in touch with us via email service@polaroid.com. Please provide your order ID in the message.\\nAll returns need to be authorized by the customer support team. They will provide an RMA number and return address which is needed for the return process. Returns without a valid RMA number may not be processed and may delay any replacement or refund. After notifying us, you must send the product(s) back to us no later than 14 days from the date on which you informed us of your decision to return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"28866dc16a1e\",\"_type\":\"block\",\"children\":[{\"_key\":\"602ca343d6120\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"602ca343d6121\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Shipment return\"},{\"_key\":\"602ca343d6122\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are shipping back one of our products, you should consider using a trackable shipping service or purchasing shipping insurance. We do not guarantee that we will receive your returned item.\\nYou are responsible for the shipping costs of your return shipment and bear the risk of loss of the return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"de25560f1f7f\",\"_type\":\"block\",\"children\":[{\"_key\":\"caeab10ca1c00\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"caeab10ca1c01\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Approval or rejection return\"},{\"_key\":\"caeab10ca1c02\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nOnce your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ac94e10e9b6f\",\"_type\":\"block\",\"children\":[{\"_key\":\"d7aa95f4b1560\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"d7aa95f4b1561\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refund\"},{\"_key\":\"d7aa95f4b1562\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are approved, you will be credited the full purchase price paid for the returned products including our initial shipping charge. It will take some days before you will see payment on your bank account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2339ff9c829d\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a2cf2ede0ce0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"4a2cf2ede0ce1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Defective products\"},{\"_key\":\"4a2cf2ede0ce2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe above applies primarily to unwanted products, as opposed to products which are exhibiting a manufacturing defect. If you have purchased products through our online shop which you believe are defective in any way, please get in touch and your claim will be evaluated under our limited warranty. For full details regarding our product warranty, please see our \"},{\"_key\":\"b1ee09a1a739\",\"_type\":\"span\",\"marks\":[\"04f6ebd640f4\"],\"text\":\"warranty policy\"},{\"_key\":\"be03a035d43c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"04f6ebd640f4\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"94a2f569-9a06-4cf4-856b-90228741a6ce\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"eff8abbc2300\",\"_type\":\"block\",\"children\":[{\"_key\":\"e9d936df57850\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIn case the defective product was bought from an authorized reseller, please contact such reseller for its warranty service. In case you might have problems to find a solution with such authorized reseller, you may contact our customer service.\\n\\n\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Returns\"},{\"_key\":\"e5e18b5d29a7\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"d0ec8bdd422f\",\"_type\":\"block\",\"children\":[{\"_key\":\"179165a9e5620\",\"_type\":\"span\",\"marks\":[],\"text\":\"From time to time, we will offer special promotions in our web shop.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e24c6eb5a3a7\",\"_type\":\"block\",\"children\":[{\"_key\":\"4ac958e3f0cd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"58e19018542e\",\"_type\":\"block\",\"children\":[{\"_key\":\"268bfe099f330\",\"_type\":\"span\",\"marks\":[],\"text\":\"The promotions will be running for a limited period of time. The exact term of the promotions will be mentioned on our Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5407e6c25715\",\"_type\":\"block\",\"children\":[{\"_key\":\"e6d0c567354a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"st y\":\"bc4ce02835b1\",\"_type\":\"block\",\"children\":[{\"_key\":\"de260f9623530\",\"_type\":\"span\",\"marks\":[],\"text\":\"We reserve our right to cancel any promotion for any reason at our sole discretion.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7eae5a200e59\",\"_type\":\"block\",\"children\":[{\"_key\":\"2d855e2689060\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"158e7e211dd6\",\"_type\":\"block\",\"children\":[{\"_key\":\"fb8c0a05c2930\",\"_type\":\"span\",\"marks\":[],\"text\":\"All our other purchase terms are applicable to our special promotions.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d0066789a788\",\"_type\":\"block\",\"children\":[{\"_key\":\"fedeef0c23c30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"72777f4535d4\",\"_type\":\"block\",\"children\":[{\"_key\":\"62f9bd2e90b70\",\"_type\":\"span\",\"marks\":[],\"text\":\"Current promotions:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ef5e703ac2ac\",\"_type\":\"block\",\"children\":[{\"_key\":\"0076857796dc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"#1 The free items offered on some product and bundles will be available while stock lasts.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d59be782d6d7\",\"_type\":\"block\",\"children\":[{\"_key\":\"81e00239d38a\",\"_type\":\"span\",\"marks\":[],\"text\":\"#2 Discounts on Polaroid Now Generation 2 cameras \u0026 Polaroid Now+ Generation 2 cameras will be available while stock lasts.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"39fff23619d4\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a8004d5a28c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"#3 Discount of 50% on select Polaroid accessories is available while stock lasts.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7a405077cff9\",\"_type\":\"block\",\"children\":[{\"_key\":\"a48c665bca76\",\"_type\":\"span\",\"marks\":[],\"text\":\"#4 Discounts on the Polaroid Flip Instant Camera, and on bundles that include it, are valid until April 6th, 2026 at 11:59 CET, while stock lasts\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"7. Promotions\"},{\"_key\":\"192df3d804ed\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"66d1344b40b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"b0064e9b74fa0\",\"_type\":\"span\",\"marks\":[],\"text\":\"All information about the products on our Website is provided for information purposes only. We recommend that you do not rely solely on the information presented on the website. Please always read labels, warnings, and directions provided with the products before use.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"8. Information on products\"},{\"_key\":\"332bb176856c\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b44edf8540e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"2e9fb8240e790\",\"_type\":\"span\",\"marks\":[],\"text\":\"When you visit our Website or send emails to us, you are communicating with us electronically. You consent to receive communications from us electronically. You agree that all agreements, notices, disclosures and other communications that we provide to you electronically satisfy any legal requirement that such communications be in writing.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"9. Electronic Communication\"},{\"_key\":\"ebaf8c4ab52c\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"5acb7d753d54\",\"_type\":\"block\",\"children\":[{\"_key\":\"530eb2500ac20\",\"_type\":\"span\",\"marks\":[],\"text\":\"You expressly agree that your use of our products is at your sole risk.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a69402ff07ca\",\"_type\":\"block\",\"children\":[{\"_key\":\"a5cf80c9987f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c8d87bb0791b\",\"_type\":\"block\",\"children\":[{\"_key\":\"57b0992388df0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We a we cannot be held responsible for delays or failure to perform if such delay or failure is caused by any circumstances beyond our reasonable control such as strikes, terrorist acts, war, supplier/transport issues, governmental or regulatory action and natural disasters. In the event of a delay, we will perform our obligations as soon as reasonably possible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"11. Force Majeure\"},{\"_key\":\"e0de1c19cc80\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"d60e49e50ec4\",\"_type\":\"block\",\"children\":[{\"_key\":\"eab33d0115730\",\"_type\":\"span\",\"marks\":[],\"text\":\"You agree that the laws of The Netherlands will govern the Terms of Purchase and any dispute of any sort that might arise between you and us. You also agree to submit to the exclusive jurisdiction of the courts of Amsterdam, The Netherlands, for any disputes with Polaroid in connection to your purchase.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"12. Choice of Law and Jurisdiction\"},{\"_key\":\"9480adb77897\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"a6d8800f8c5f\",\"_type\":\"block\",\"children\":[{\"_key\":\"f71d25cd7abb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"No failure to exercise, nor any delay in exercising any of Polaroid's rights or remedies shall operate as a waiver, nor shall any single or partial exercise of any of Polaroid's rights or remedies prevent any further or other exercise or the exercise of any other right or remedy. Polaroid's rights and remedies provided in these Terms of Purchase are cumulative and not exclusive of any rights or remedies provided by law.If you cancel your order before we have accepted your order, then we will promptly refund any payment already made for the order of the respective products.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"13. Waiver\"}],\"blocks_uk\":[{\"_key\":\"f9860ed54ff5\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"cda13446b398\",\"_type\":\"block\",\"children\":[{\"_key\":\"4054cf4f01b20\",\"_type\":\"span\",\"marks\":[],\"text\":\"These terms of purchase were last updated in March, 2026. Please check regularly to stay informed of updates.\"}],\"markDefs\":[],\"style\":\"normal\"}]},{\"_key\":\"218537f0df4e\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"2bcafd783052\",\"_type\":\"block\",\"children\":[{\"_key\":\"96d51f385f080\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Applicability\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a72d2a7f2338\",\"_type\":\"block\",\"children\":[{\"_key\":\"510a55087e5b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"These terms of purchase (\"},{\"_key\":\"510a55087e5b1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Terms of Purchase\"},{\"_key\":\"510a55087e5b2\",\"_type\":\"span\",\"marks\":[],\"text\":\") apply when you purchase from our United Kingdom or Europe \u0026 Rest of Word regional websites (\"},{\"_key\":\"510a55087e5b3\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Website\"},{\"_key\":\"510a55087e5b4\",\"_type\":\"span\",\"marks\":[],\"text\":\").\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"de83ef366213\",\"_type\":\"block\",\"children\":[{\"_key\":\"d8c889e619700\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"58199d78344f\",\"_type\":\"block\",\"children\":[{\"_key\":\"a97292ffeb5e0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Agreement\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fb31f71f38d3\",\"_type\":\"block\",\"children\":[{\"_key\":\"e8d64535dd000\",\"_type\":\"span\",\"marks\":[],\"text\":\"When you purchase from our Website, an agreement is entered with Polaroid International B.V., a Dutch limited liability company, registered with the Netherlands Chamber of Commerce under no. 59065982, with its business address at Danzigerkade 16c, 1013 AP Amsterdam, The Netherlands (\"},{\"_key\":\"e8d64535dd001\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Polaroid, we or our\"},{\"_key\":\"e8d64535dd002\",\"_type\":\"span\",\"marks\":[],\"text\":\").\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e6de054c64d4\",\"_type\":\"block\",\"children\":[{\"_key\":\"44c960635e320\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"33f5022f699a\",\"_type\":\"block\",\"children\":[{\"_key\":\"f4133e21d9370\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Contact\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"49b60dab4a14\",\"_type\":\"block\",\"children\":[{\"_key\":\"28b10d71750f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can contact Polaroid at service@polaroid.com.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"1. About these terms of purchase\"},{\"_key\":\"6c31fb848dac\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"968cbc20ef77\",\"_type\":\"block\",\"children\":[{\"_key\":\"d03069a9d5c60\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Placing order\"},{\"_key\":\"d03069a9d5c61\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nBefore you can order products from our Website, you need to fill in some personal details, including your email address and shipping address. When you place your order, we will send you an email confirming receipt of your order and containing the details of your order.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"13210b611685\",\"_type\":\"block\",\"children\":[{\"_key\":\"8de1f854d8c90\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a3f5f8f48f60\",\"_type\":\"block\",\"children\":[{\"_key\":\"34e91d7d43de0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Processing order\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"71a24e62a340\",\"_type\":\"block\",\"children\":[{\"_key\":\"5d18b68c0c830\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once we have processed and set up your order for delivery, we will send you a shippig confirmation email. We usually send the shipping confirmation email within one (1) working day after you place your order.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"98f60d3e3165\",\"_type\":\"block\",\"children\":[{\"_key\":\"f4a1103f432f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5f2b0e1c0a1d\",\"_type\":\"block\",\"children\":[{\"_key\":\"0492ce2157d00\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Cancelling or changing order\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1af1e0c28afc\",\"_type\":\"block\",\"children\":[{\"_key\":\"7f0a4eb16def0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once your order has been placed and processing has begun, it is not possible to cancel or make any changes to your order. Please double-check your order details carefully before completing your purchase.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"65e4ce3b2226\",\"_type\":\"block\",\"children\":[{\"_key\":\"b3cad08b514a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"b3cad08b514a1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refusing order\"},{\"_key\":\"b3cad08b514a2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe reserve the right to refuse any order you place with us. We may limit or cancel quantities purchased per person, per household or per order, in our discretion. These restrictions may include orders placed by, or under the same customer account, the same credit card, and/or orders that use the same billing and/or shipping address. If we refuse or change your order, we will notify you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"4f7b4b941e07\",\"_type\":\"block\",\"children\":[{\"_key\":\"0419f60f1dba0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"aef38320666f\",\"_type\":\"block\",\"children\":[{\"_key\":\"be2226e9928c0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"No reselling\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7d026bd1bde8\",\"_type\":\"block\",\"children\":[{\"_key\":\"a4792b5d0fb80\",\"_type\":\"span\",\"marks\":[],\"text\":\"From our Website, we only sell products to end customers for private use. It is not permitted to use our Website to purchase products for resale or export to companies. We also reserve the right to limit or prohibit orders that, in our sole judgment, appear to be placed for resale or export.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9def2fdc8138\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a69720f9ac00\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"4a69720f9ac01\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Minors\"},{\"_key\":\"4a69720f9ac02\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe do not sell goods for purchase by minors. If you are under 18 you may only order with the permission of a legal representative.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cd3b4b09dd78\",\"_type\":\"block\",\"children\":[{\"_key\":\"a386ed2f88300\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0ca1969e0d09\",\"_type\":\"block\",\"children\":[{\"_key\":\"c4e3e86221110\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Availability products\"},{\"_key\":\"c4e3e86221111\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe usually list unavailability information for out of stock products on the respective information page of those products. Beyond what we say on that page or elsewhere on the Website, we cannot be more specific about availability. As we process your order, we will inform you by email as soon as possible if any products you order turn out to be unavailable. You will not be charged for those products and if already charged, a refund shall be issued.\\n\\n\"},{\"_key\":\"c4e3e86221112\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Accurate account\"},{\"_key\":\"c4e3e86221113\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou agree to provide current, complete and accurate purchase and account information for all purchases made through our Website. You agree to promptly update your account and other information, including your email address and credit card numbers and expiration dates, so that we can complete your transactions and contact you as needed.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"44966d5c3713\",\"_type\":\"block\",\"children\":[{\"_key\":\"6ef44b7d8bc70\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"6ef44b7d8bc71\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Privacy\"},{\"_key\":\"6ef44b7d8bc72\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nBy submitting orders you consent to the processing of personal data, such as name and title, address, telephone number, contact details and other personal details in accordance with the terms notified in our \"},{\"_key\":\"59890f14a7c4\",\"_type\":\"span\",\"marks\":[\"f4165fb0a281\"],\"text\":\"privacy policy \"},{\"_key\":\"3a1bc9c53d16\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"f4165fb0a281\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"2. Order\"},{\"_key\":\"b7eb81dcff43\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9017c886d239\",\"_type\":\"block\",\"children\":[{\"_key\":\"ee4ddc283ac10\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Prices\"},{\"_key\":\"ee4ddc283ac11\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nPrices for our products are subject to change without notice.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a43c06d2153b\",\"_type\":\"block\",\"children\":[{\"_key\":\"9d357aac47600\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"9d357aac47601\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Invoices\"},{\"_key\":\"9d357aac47602\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou consent to receive sales invoices electronically via email.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bc81e885a812\",\"_type\":\"block\",\"children\":[{\"_key\":\"82163f16988f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"82163f16988f1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tax\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8d00e7d219e4\",\"_type\":\"block\",\"children\":[{\"_key\":\"880e3b65d8c30\",\"_type\":\"span\",\"marks\":[],\"text\":\"Within the European Union (\"},{\"_key\":\"880e3b65d8c31\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EU\"},{\"_key\":\"880e3b65d8c32\",\"_type\":\"span\",\"marks\":[],\"text\":\"), all prices are inclusive of legally applicable VAT.\\nIf your order is being shipped to a country outside the EU, all prices are net prices excluding any taxes and/or shipping costs. You will see any taxes and shipping costs added at checkout, which may vary depending on the courier and destination.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"52c152f03e33\",\"_type\":\"block\",\"children\":[{\"_key\":\"ede72c6a8fa20\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"ede72c6a8fa21\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Currency\"},{\"_key\":\"ede72c6a8fa22\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe purchase price, shipping costs and any legally applicable tax, if any, are due without any deduction. All payments must be made in the currency shown on the Website. If your bank account is held in another currency, you bear the costs, if any, for currency exchanges to the currency shown on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1190659c585f\",\"_type\":\"block\",\"children\":[{\"_key\":\"90a693b3d90c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"90a693b3d90c1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Payment options\"},{\"_key\":\"90a693b3d90c2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou can pay for your purchase using a range of payment options indicated in the order process on our Website. Payment via one of these payment methods is processed via the secured payment service of our financial service provider which conforms to required security standards. Polaroid does not have access to this sensitive data.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Payment and prices\"},{\"_key\":\"7d3e09b36147\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"5cb4c1ebd60d\",\"_type\":\"block\",\"children\":[{\"_key\":\"7b344357b5cd0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Delivery service\"},{\"_key\":\"7b344357b5cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe provide delivery services within the United Kingdom for all orders placed by from our United Kingdom website. For order placed from our EU \u0026 Rest of World website, we provide delivery services to most countries. Please find a list of notable exception \"},{\"_key\":\"4edbed20de13\",\"_type\":\"span\",\"marks\":[\"88698bcdb4cb\"],\"text\":\"here\"},{\"_key\":\"cfb086a6ba80\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"88698bcdb4cb\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/en-us/articles/115012406227-Which-countries-do-you-ship-to\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"d0c7d80f657a\",\"_type\":\"block\",\"children\":[{\"_key\":\"b381c60d15840\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"01d5dea75969\",\"_type\":\"block\",\"children\":[{\"_key\":\"4459f273a4d60\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are not able to ship to PO boxes or service points since our chosen courier and shipment method requires a signature of receipt by the recipient for all deliveries.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"761160d3c5ad\",\"_type\":\"block\",\"children\":[{\"_key\":\"05fe0e15b7660\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"39724cfa3567\",\"_type\":\"block\",\"children\":[{\"_key\":\"f29169ae9b790\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Courier \u0026 Shipping\"},{\"_key\":\"f29169ae9b791\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nDelivery will be handled by a courier of our choice. We may offer options between different couriers and/or shipping methods. Unless stated otherwise, shipping costs will be borne by you and will depend on the weight of the ordered products, the selected shipping method, and the delivery address.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c70c14b13c14\",\"_type\":\"block\",\"children\":[{\"_key\":\"4dcb5345c8eb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dbb591c60418\",\"_type\":\"block\",\"children\":[{\"_key\":\"8f2f1334f8880\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do our very best to keep your shipping costs reasonable, but we only offer traceable courier services as all our products are highly fragile and should reach you in the best and fastest way possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f9ccdb48625f\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9fadd8907200\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"f9fadd8907201\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Import\"},{\"_key\":\"f9fadd8907202\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWhen ordering from Polaroid, you are considered the importer of record and must comply with all laws and regulations of the country in which you will receive the products. You are responsible for assuring that the products can be lawfully imported to the destination country and for payment of possible import duties and possible handling fees. An exception applies for delivery to the United Kingdom, where Polaroid will act as the importer of record.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9fdb961287c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"c73ccd5db59b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"c73ccd5db59b1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Tracking order\"},{\"_key\":\"c73ccd5db59b2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nYou will receive a shipping confirmation email with a tracking number as soon as your order has been shipped. This is the most accurate way to check up on your order.\\nYou can also see the status of your order by logging into your Polaroid account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cb9d0909b7a6\",\"_type\":\"block\",\"children\":[{\"_key\":\"3637ddb153dc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"3637ddb153dc1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Damage during shipment\"},{\"_key\":\"3637ddb153dc2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nShould your shipment arrive at your delivery address damaged, please do not accept the shipment, or have the courier confirm the damage. Since courier services will not accept damage complaints that are filed at a later date, we will not be able to offer compensation or replacement in such cases.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f59ea2a55772\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a4501b767760\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"3581a50667f7\",\"_type\":\"block\",\"children\":[{\"_key\":\"e9741a432c060\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Reporting Missing or\"},{\"_key\":\"e9741a432c061\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"},{\"_key\":\"e9741a432c062\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Incorrect Deliveries\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"16f66c44b9c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"0ec9d631e4920\",\"_type\":\"span\",\"marks\":[],\"text\":\"Please inspect your order upon receipt. If you believe that any item is missing from your order, that an incorrect item has been delivered, or that a delivery has been missed, failed, or otherwise not completed in accordance with your order, you must report this to our customer support team within 10 days of the date on which you receive the packaging (or, if no packaging is delivered, within 10 days of the date on which delivery was scheduled). Reports should include sufficient details to identify the order (such as order number and item description) and a clear description of the issue. If you do not report missing, incorrect, or failed deliveries within this 10-day period, we may be unable to accept your claim or provide replacement items. Customer support can be contacted via the contact details set out in these Terms.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Delivery and shipment\"},{\"_key\":\"ba8eaad87858\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"1fbdfc7d74e7\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a26de1ff81d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Property in the products passes at the time of delivery to you or to a third party indicated by you. At the same time the risk of deterioration in the products passes to you. Any products delivered to you or to a third party indicated by you remain Polaroid’s property until they have been fully paid for. You or such third party indicated by you are/is obligated to handle the products with due care until title in them has been transferred to you or such third party indicated by you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Title to the products\"},{\"_key\":\"a92eb29eda20\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"58d0eb4c0e72\",\"_type\":\"block\",\"children\":[{\"_key\":\"20af2eda35760\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return period\"},{\"_key\":\"20af2eda35761\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nWe have a standard 14-day return policy for all purchases made through our online shop. If you are dissatisfied with your purchase for any reason, you may return it for a full refund within 14 days of receiving the product(s).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"468f274e265b\",\"_type\":\"block\",\"children\":[{\"_key\":\"6640264dc25c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"6640264dc25c1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Return conditions\"},{\"_key\":\"6640264dc25c2\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nTo be eligible for a return, your product must be in the same condition as received, so unused and unopened with all original packaging and documentation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"392f5c29b5c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce5e29536be90\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"ce5e29536be91\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"How to return\"},{\"_key\":\"ce5e29536be92\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nAll returns are handled on a case-by-case basis: you will need to get in touch with us via email service@polaroid.com. Please provide your order ID in the message.\\nAll returns need to be authorized by the customer support team. They will provide an RMA number and return address which is needed for the return process. Returns without a valid RMA number may not be processed and may delay any replacement or refund. After notifying us, you must send the product(s) back to us no later than 14 days from the date on which you informed us of your decision to return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"74fa049d55d9\",\"_type\":\"block\",\"children\":[{\"_key\":\"453b278037e30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"453b278037e31\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Shipment return\"},{\"_key\":\"453b278037e32\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are shipping back one of our products, you should consider using a trackable shipping service or purchasing shipping insurance. We do not guarantee that we will receive your returned item.\\nYou are responsible for the shipping costs of your return shipment and bear the risk of loss of the return.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d9413764387e\",\"_type\":\"block\",\"children\":[{\"_key\":\"b0730402a9060\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"b0730402a9061\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Approval or rejection return\"},{\"_key\":\"b0730402a9062\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nOnce your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"aacd45eca0e0\",\"_type\":\"block\",\"children\":[{\"_key\":\"a948b52d0dc30\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"a948b52d0dc31\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Refund\"},{\"_key\":\"a948b52d0dc32\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIf you are approved, you will be credited the full purchase price paid for the returned products including our initial shipping charge. It will take some days before you will see payment on your bank account.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7fca52fe05ff\",\"_type\":\"block\",\"children\":[{\"_key\":\"e98cf27823580\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"},{\"_key\":\"e98cf27823581\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Defective products\"},{\"_key\":\"e98cf27823582\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nThe above applies primarily to unwanted products, as opposed to products which are exhibiting a manufacturing defect. If you have purchased products through our online shop which you believe are defective in any way, please get in touch and your claim will be evaluated under our limited warranty. For full details regarding our product warranty, please see our \"},{\"_key\":\"8bbdbd348fcc\",\"_type\":\"span\",\"marks\":[\"b6428d0c2587\"],\"text\":\"warranty policy\"},{\"_key\":\"df6fa259070d\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"b6428d0c2587\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"94a2f569-9a06-4cf4-856b-90228741a6ce\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"f15a367c0bcf\",\"_type\":\"block\",\"children\":[{\"_key\":\"605e28f2537a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\nIn case the defective product was bought from an authorized reseller, please contact such reseller for its warranty service. In case you might have problems to find a solution with such authorized reseller, you may contact our customer service.\\n\\n\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Returns\"},{\"_key\":\"3b69239dd901\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"c1aca1cfa0f5\",\"_type\":\"block\",\"children\":[{\"_key\":\"06a4e9ec5dd80\",\"_type\":\"span\",\"marks\":[],\"text\":\"From time to time, we will offer special promotions in our web shop.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"222cff6ea5a0\",\"_type\":\"block\",\"children\":[{\"_key\":\"d15df4bc284d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5644baa07a80\",\"_type\":\"block\",\"children\":[{\"_key\":\"5a897f26da540\",\"_type\":\"span\",\"marks\":[],\"text\":\"The promotions will be running for a limited period of time. The exact term of the promotions will be mentioned on our Website.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6de7998fffb1\",\"_type\":\"block\",\"children\":[{\"_key\":\"e4d5afda3e960\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f4384062f375\",\"_type\":\"block\",\"children\":[{\"_key\":\"02ccabc40f980\",\"_type\":\"span\",\"marks\":[],\"text\":\"During our promotions special discounts will apply and will only be valid during the limited term of the promotions. ":[{\"_key\":\"e9087c94ae1e\",\"_type\":\"block\",\"children\":[{\"_key\":\"9540bca760750\",\"_type\":\"span\",\"marks\":[],\"text\":\"All information about the products on our Website is provided for information purposes only. We recommend that you do not rely solely on the information presented on the website. Please always read labels, warnings, and directions provided with the products before use.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"8. Information on products\"},{\"_key\":\"4b58418c3a8b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"06889ab6c16c\",\"_type\":\"block\",\"children\":[{\"_key\":\"70451f9d999c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"When you visit our Website or send emails to us, you are communicating with us electronically. You consent to receive communications from us electronically. You agree that all agreements, notices, disclosures and other communications that we provide to you electronically satisfy any legal requirement that such communications be in writing.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"9. Electronic Communication\"},{\"_key\":\"4b275d19d617\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b74a0f3e17c0\",\"_type\":\"block\",\"children\":[{\"_key\":\"c6d48716415a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You expressly agree that your use of our products is at your sole risk.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2ecd48b1afb6\",\"_type\":\"block\",\"children\":[{\"_key\":\"cd4c1cc1e2bc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c30fcf88a646\",\"_type\":\"block\",\"children\":[{\"_key\":\"35ede95ea6ed0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are not liable to you for:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1a05ef4cbd90\",\"_type\":\"block\",\"children\":[{\"_key\":\"8394e9f3b3160\",\"_type\":\"span\",\"marks\":[],\"text\":\"any indirect, incidental, consequential, punitive or exemplary damages, e\":\"emailLink\",\"mailAddress\":\"service@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"6. Can I pause my Subscription?\"},{\"_key\":\"50d44a78e27b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"6126c5f372c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"c12905f7fb970\",\"_type\":\"span\",\"marks\":[],\"text\":\"You will receive a notification email three (3) days before your order ships. Should you want to skip the order or cancel your Subscription before your next shipment, you can do so until you receive the confirmation email indicating your order has been placed. Log into your Polaroid account at Polaroid.com or contact the Polaroid Customer Service at \"},{\"_key\":\"a9eaf8a70551\",\"_type\":\"span\",\"marks\":[\"e6f960d04735\"],\"text\":\"service@polaroid.com\"},{\"_key\":\"4a66b986ffc1\",\"_type\":\"span\",\"marks\":[],\"text\":\" to manage your Subscription.\"}],\"markDefs\":[{\"_key\":\"e6f960d04735\",\"_type\":\"emailLink\",\"mailAddress\":\"service@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"7. How will I know when my order will ship?\"},{\"_key\":\"6ca28cf95f36\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"d4ee840592b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"73eaba4af2350\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once your order has shipped, we are not able to cancel it. Yet, once you have received the order, you can return the order in accordance with the \"},{\"_key\":\"f2371b5c2281\",\"_type\":\"span\",\"marks\":[\"d181aef4069f\"],\"text\":\"Terms  of Purchase\"},{\"_key\":\"f8e4d9545019\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"d181aef4069f\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"9849dd1f-daf9-4438-a6a8-d83af9862c12\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"a2b44c25de81\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6117b2d17a60\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"8. Can I cancel an order that has already been shipped?\"},{\"_key\":\"0f2de1d8c8c3\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"57708858dda3\",\"_type\":\"block\",\"children\":[{\"_key\":\"c222cffbd21c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"By enrolling in the Polaroid Film Subscription, you agree to recurring charges at the frequency you selected, until you cancel your Subscription. You will be charged the price applicable at the time of each shipment, using payment method. Similar to other orders you place on Polaroid.com, you can pay for your orders with your credit card or other accepted payments. The payment method you choose for your first order will be used to automatically process the next orders.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"9. How can I pay for the Polaroid Film Subscription?\"},{\"_key\":\"75ecb2b3fdf5\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"8d5851fbc216\",\"_type\":\"block\",\"children\":[{\"_key\":\"6dc9b9fb6b430\",\"_type\":\"span\",\"marks\":[],\"text\":\"If the payment fails on the due date, we will try to confirm payment daily for a period of 14 days. After 14 failed payments, we will cancel your Subscription.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"10. What if my payment fails?\"},{\"_key\":\"273f1b211ad3\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"cad9e45343a4\",\"_type\":\"block\",\"children\":[{\"_key\":\"6620c9169db10\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes, the prices of items in your Subscription may change. If Polaroid increases or decreases the prices of film or film bundles, the updated prices will automatically apply to your future Subscription orders.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"11. Can Polaroid change the price of my Subscription item? \"},{\"_key\":\"a021b47f4dbb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"637e44c01a4f\",\"_type\":\"block\",\"children\":[{\"_key\":\"36e4d29110210\",\"_type\":\"span\",\"marks\":[],\"text\":\"If your Polaroid Film Subscription items are out of stock, we will notify you by email. The order will be withheld and retried as soon as all items are available again. Please remember that you can always cancel your Polaroid Film Subscription, or skip your next order.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"12. What happens if an item is out of stock?\"},{\"_key\":\"fe44d06ac7f8\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"80a786368150\",\"_type\":\"block\",\"children\":[{\"_key\":\"74423dadb6830\",\"_type\":\"span\",\"marks\":[],\"text\":\"We do not charge a shipping fee for your Polaroid Film Subscription orders. \"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"13. Do I have to pay shipping?\"},{\"_key\":\"4e26bb689a33\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"2ac246a421fa\",\"_type\":\"block\",\"children\":[{\"_key\":\"9e76291946af0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can subscribe for the Polaroid Film Subscription when you’re 18 years or older.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"31a10987a943\",\"_type\":\"block\",\"children\":[{\"_key\":\"aabcac8577a50\",\"_type\":\"span\",\"marks\":[],\"text\":\"The Polaroid Film Subscription is currently only availablefor customers that have a delivery address in the United States or Canada.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"14. Can everyone subscribe for the Polaroid Film Subscription?\"},{\"_key\":\"66881e6b7515\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"59c87ccd791a\",\"_type\":\"block\",\"children\":[{\"_key\":\"4ac1421a24be0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We can modify the Polaroid Film Subscription Terms \u0026 Conditions at our own discretion, but we will notify you of any material changes in advance and remind you of the option to cancel your Subscription at any time.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"15. Can Polaroid change these Polaroid Film Subscription Terms \u0026 Conditions?\"},{\"_key\":\"c25a41e85208\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"a7888a608ddc\",\"_type\":\"block\",\"children\":[{\"_key\":\"03a1162f93ed0\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you have any questions, please contact Polaroid’s Customer Service at \"},{\"_key\":\"f572520fa385\",\"_type\":\"span\",\"marks\":[\"a457074e79a8\"],\"text\":\"service@polaroid.com\"},{\"_key\":\"d80b1f094d89\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"a457074e79a8\",\"_type\":\"emailLink\",\"mailAddress\":\"service@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"16. Contact Information \"}],\"campaign\":null,\"category\":null,\"description\":\"Polaroid Film Subscription Terms \u0026 Conditions\\n\",\"seoDescription\":\"Polaroid Film Subscription Terms \u0026 Conditions \",\"seoTitle\":\"Polaroid Film Subscription Terms \u0026 Conditions \",\"slug\":{\"_type\":\"slug\",\"current\":\"film-subscription-terms-conditions\"},\"title\":\"Film Subscription Terms \u0026 Conditions\"}}],\"style\":\"normal\"}],\"titleQuantityReached\":\"Quantity limit reached\",\"uspsBanner\":[{\"overlayDescription\":\"Free standard shipping is available for all orders shipping within the European Union and is totalling €95 and above.\",\"overlayLink\":null,\"overlayTitle\":\"Free Standard Shipping over €95 \",\"region\":[\"eu_store\"],\"title\":\"Free Standard Shipping over €95 \"},{\"overlayDescription\":\"Free standard shipping is available for all orders shipping within the United Kingdom and is totalling £80 and above.\",\"overlayLink\":null,\"overlayTitle\":\"Free Standard Shipping over £80\",\"region\":[\"uk_store\"],\"title\":\"Free Standard Shipping over £80\"},{\"overlayDescription\":\"Free standard shipping is available for all orders shipping within the United States and is totalling $75 and above.\",\"overlayLink\":null,\"overlayTitle\":\"Free Standard Shipping over $75 (US only)\",\"region\":[\"us_store\"],\"title\":\"Free Standard Shipping over $75 (US only)\"},{\"overlayDescription\":
