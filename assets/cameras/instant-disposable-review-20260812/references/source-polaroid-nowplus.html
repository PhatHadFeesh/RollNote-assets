type\":\"span\",\"marks\":[],\"text\":\"By being a member, you will be able to earn Points which you can redeem for discounts and other perks. You will also have access to Member exclusive content, and you gain access to exclusive offers.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0b1550e14649\",\"_type\":\"block\",\"children\":[{\"_key\":\"0e264c6dbc4a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Membership in the Polaroid Membership Program is free. No purchase is necessary to obtain membership.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"96efd5634976\",\"_type\":\"block\",\"children\":[{\"_key\":\"d757206dad530\",\"_type\":\"span\",\"marks\":[],\"text\":\"You are only allowed to hold one account per natural person. Persons who are discovered to have more than one account forfeit their Points and will be unsubscribed from the Polaroid Membership Program.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ab0b4b4a83fc\",\"_type\":\"block\",\"children\":[{\"_key\":\"29c036acd38b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to \"},{\"_key\":\"562f53a911e7\",\"_type\":\"span\",\"marks\":[\"3f9cf77c656a\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"af5d46381f74\",\"_type\":\"span\",\"marks\":[],\"text\":\" or use \"},{\"_key\":\"2900ccac7db6\",\"_type\":\"span\",\"marks\":[\"abd895e65242\"],\"text\":\"our form\"},{\"_key\":\"fd56b735a214\",\"_type\":\"span\",\"marks\":[],\"text\":\". If you delete your account, you will lose your Points and other perks of the Polaroid Membership Program. Deleting your Polaroid account does not automatically result in the removal of any content you have submitted through the Creative Calls feature in the Polaroid App. If you wish to request the removal of your submitted content, you can do so by contacting us at \"},{\"_key\":\"60c0bdbfd7c9\",\"_type\":\"span\",\"marks\":[\"fc180337bc0b\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"05672bbf4ead\",\"_type\":\"span\",\"marks\":[],\"text\":\" or use \"},{\"_key\":\"7c19fddfcd39\",\"_type\":\"span\",\"marks\":[\"45854407d9ce\"],\"text\":\"our form\"},{\"_key\":\"5cd245149923\",\"_type\":\"span\",\"marks\":[],\"text\":\". For more information about how we handle and retain data, we refer to our \"},{\"_key\":\"eda4170d8c78\",\"_type\":\"span\",\"marks\":[\"4f63eaf09781\"],\"text\":\"Privacy Policy\"},{\"_key\":\"d341d44432eb\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"45854407d9ce\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/requests/new?tf_360020994779=account_query\u0026ticket_form_id=360001906579\",\"targetNewWindow\":true},{\"_key\":\"fc180337bc0b\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"},{\"_key\":\"3f9cf77c656a\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"},{\"_key\":\"4f63eaf09781\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}},{\"_key\":\"abd895e65242\",\"_type\":\"externalLink\",\"href\":\"https://support.polaroid.com/hc/requests/new?tf_360020994779=account_query\u0026ticket_form_id=360001906579\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"2. Membership\"},{\"_key\":\"0efefec93574\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"500481a1f9a2\",\"_type\":\"block\",\"children\":[{\"_key\":\"6d7d6689614a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Persons eligible for membership are limited to those natural persons who are at least 18 years of age. If you are under 18, you may only use the Polaroid Membership Program with the permission of a legal representative.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9b8aba6f3b09\",\"_type\":\"block\",\"children\":[{\"_key\":\"41cb14ba22080\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may refuse admission to any person who does not meet the requirements pertaining to the Polaroid Membership Program. We are not required to provide any reason in case of denial of membership.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Eligibility\"},{\"_key\":\"e44370121217\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"4ec2a667c56a\",\"_type\":\"block\",\"children\":[{\"_key\":\"4707ced2f5880\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can earn Points with every purchase on polaroid.com. To receive Points, you must log into your Polaroid account. For every €1 or $1 (or the equivalent in your local currency - exchange rates apply) you spend on purchases, you earn 1 Point. Points are added to your account once the order is fulfilled.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6e318f7d26b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce35cbc5e2a70\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points are based on your order total after deduction of any discount codes (including discount codes for gift cards), but including taxes and shipping costs.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"47a6b9a650d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"ca020bf702290\",\"_type\":\"span\",\"marks\":[],\"text\":\"To the extent you are taking part in Creative Calls via the Polaroid App, you earn 5 Points for each time you participate.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"002bc131f97f\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b5ad1f7a4e20\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can also earn Points for certain interactions, including but not limited to welcome Points and referral Points. These interactions and the number of Points eligible for each interaction will be set out on your account. When you click on “Earn Points” you will see the list with interactions with us and their associated Points. We may change, discontinue, or add interactions where you can earn Points and change the number of Points earned in our sole discretion and without prior notification.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1d5e61283e5e\",\"_type\":\"block\",\"children\":[{\"_key\":\"72b670cc385b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points earned for a purchase that is then the subject of a return, cancellation, refund or declined credit card, or other credit will be deducted from your account in an amount equal to the Points earned for the original transaction.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. Earning Points\"},{\"_key\":\"d1952ce28c59\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"cd13281d203d\",\"_type\":\"block\",\"children\":[{\"_key\":\"462e928c80d10\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points must be used in increments outlined in these Membership Terms. The maximum number of Points that may be used in a single transaction is 550 Points.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"66a2dcf0edfd\",\"_type\":\"block\",\"children\":[{\"_key\":\"b5047ede666d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can redeem Points by clicking on the tab “My Feed” on your account. Next, click on any available item under \\\"Rewards\\\".\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"49ca34b62ed2\",\"_type\":\"block\",\"children\":[{\"_key\":\"d7aae9e820320\",\"_type\":\"span\",\"marks\":[],\"text\":\"When you want to redeem any of the available coupons under “Rewards” you will see a list of coupon values and their associated cost in Points.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"198337f422da\",\"_type\":\"block\",\"children\":[{\"_key\":\"06340dc205620\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can choose the amount of Points you want to redeem and receive a coupon code immediately that you can use. You will get a confirmation of the coupon code in your e-mail, which you can use during the checkout procedure in the field marked “discount”.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bad7b1d5a3c2\",\"_type\":\"block\",\"children\":[{\"_key\":\"af843f17097f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Discount codes are non-transferable. They can only be used by the account that redeemed the Points and received the code. You are required to be logged into your account in order to use the discount code within the checkout process.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"85c939f63ba1\",\"_type\":\"block\",\"children\":[{\"_key\":\"a5abd300633a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can use only one discount code per transaction. Reward discount codes may not be combined with other discount codes. Points accumulated on different accounts by different members may not be combined or aggregated to make purchases of products or for any other reason.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Use of Points to Spend\"},{\"_key\":\"5aa4c19123a6\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"dc4ee26a01c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"3aa5714b98fc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"The Polaroid Membership Program has four separate levels: Level 1, Level 2, Level 3 and Level 4. You can move up through different level by earning Points. Your level is continuously recalculated based on your activity in the past year, relative to today's date. Please note that without recent purchases, your level may decrease as older points are no longer included in the calculation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"acd7b1e456f6\",\"_type\":\"block\",\"children\":[{\"_key\":\"5c1164b9d3e70\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 1\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"649b3fb8669c\",\"_type\":\"block\",\"children\":[{\"_key\":\"01419e84ed340\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 1 is the entry level for all Members.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5446cc6d1af3\",\"_type\":\"block\",\"children\":[{\"_key\":\"aa18f3bf1fb90\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 2\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48b0df00f4b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"40c98d067c290\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 2 is the level for Members between 200 and 1000 Points.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d0e52b6395ce\",\"_type\":\"block\",\"children\":[{\"_key\":\"5f5aa3f98a340\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 3\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5d69dc61b102\",\"_type\":\"block\",\"children\":[{\"_key\":\"75b9b51af79e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 3 is the level for Members with 1000 Points and 1500 Points.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f64cb757b408\",\"_type\":\"block\",\"children\":[{\"_key\":\"ac45eef377aa0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Level 4\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"17e7d83cad85\",\"_type\":\"block\",\"children\":[{\"_key\":\"6b08e029f7930\",\"_type\":\"span\",\"marks\":[],\"text\":\"Level 4 is the level for Members with 1500 Points and above.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b538ebbe7664\",\"_type\":\"block\",\"children\":[{\"_key\":\"314008482fa30\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can climb to a higher level by accumulating the number of Points mentioned above. When you proceed a level you will receive points as an entry reward. If level upgrades are achieved by acquiring Points through purchases of our products, we reserve the right to delay this upgrade for a period that is equal to the applicable return period for the purchased product.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Levels\"},{\"_key\":\"90322085720f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9711a6714d4f\",\"_type\":\"block\",\"children\":[{\"_key\":\"8ed57dbb16fd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"As long as the Polaroid Membership Program is in place, Points do not expire. However, points that are older than a year are not included in the calculation of your level.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dcd67f28296c\",\"_type\":\"block\",\"children\":[{\"_key\":\"bc91cc8394990\",\"_type\":\"span\",\"marks\":[],\"text\":\"Once Points are redeemed and you have been assigned a discount code, we will not reapply the Points to your account.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"7. Expiration\"},{\"_key\":\"97bd29ecd810\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"4431cf8490d7\",\"_type\":\"block\",\"children\":[{\"_key\":\"a370d1b288d50\",\"_type\":\"span\",\"marks\":[],\"text\":\"The creation of a Polaroid account by you and the use of the Polaroid Membership Program implies your full acceptance of these Membership Terms, together with any and all rules and policies provided by us, including our \"},{\"_key\":\"e9537c1cdbfa\",\"_type\":\"span\",\"marks\":[\"c83ed029fccf\"],\"text\":\"Privacy Policy\"},{\"_key\":\"d63e2a0d5ca9\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"75b8b41fce53\",\"_type\":\"span\",\"marks\":[\"829a96ab6f00\"],\"text\":\"App Privacy Policy\"},{\"_key\":\"7410c5d9f6b9\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"c83ed029fccf\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"495d7f85-9797-460f-bc34-02b8652218c8\",\"_type\":\"reference\"}},{\"_key\":\"829a96ab6f00\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"48e42bc2-790c-4ab2-943f-746457c5718c\",\"_type\":\"reference\"}}],\"style\":\"normal\"},{\"_key\":\"7049e72e79cc\",\"_type\":\"block\",\"children\":[{\"_key\":\"7f9f2e11a4810\",\"_type\":\"span\",\"marks\":[],\"text\":\"We reserve the right to change these Membership Terms at any time by posting revised terms on this website. You are advised to check the Membership Terms on this website from time to time for any updates or changes that may impact you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"24c19e214634\",\"_type\":\"block\",\"children\":[{\"_key\":\"b915d27f67e80\",\"_type\":\"span\",\"marks\":[],\"text\":\"We reserve the right without notice to cancel, hold, void, suspend or restrict the Polaroid Membership Program, your account, the redemption of Points, or any aspect of the Polaroid Membership Program, including, without limitation, the point conversion ratio and the point expiration policy at any time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"05475612baf8\",\"_type\":\"block\",\"children\":[{\"_key\":\"38b7c28cb6bc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may revoke your membership in the Polaroid Membership Program if we believe or suspect fraud or abuse relating to the accrual of Points or redemption of rewards.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e25d10278282\",\"_type\":\"block\",\"children\":[{\"_key\":\"2e61e9a45c510\",\"_type\":\"span\",\"marks\":[],\"text\":\"Your Points balance, as reflected in our records, shall be deemed correct. We reserve the right to determine the amount of Points in your account based on Polaroid internal records related to your account. In the event of an inconsistency between the amount accrued in your account as stated on your receipt and our internal records, our internal records will control.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c39094085b59\",\"_type\":\"block\",\"children\":[{\"_key\":\"dee9a1d906a40\",\"_type\":\"span\",\"marks\":[],\"text\":\"Points are non-transferable, non-redeemable for cash, are non-refundable and are not valid outside of polaroid.com. Purchases made outside polaroid.com are not valid for point accrual.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c7a3032872f1\",\"_type\":\"block\",\"children\":[{\"_key\":\"32b9c012412c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will make reasonable efforts to award you Points as outlined above, but we are not respon ithdraw your granted consent at any time, after which we will stop the further processing of your personal data. However, withdrawal of your consent does not affect the lawfulness of the processing prior to that moment. Please note that if you withdraw your consent certain features of our Website, products and/or services may no longer be accessible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Legal bases of the processing of your personal data\"},{\"_key\":\"7d81979f33bb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"72ec5be02e7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"cdde5da8fdec0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid (and third party data processors acting on our behalf) may collect, store and process your personal data for the following purposes:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"63a8eb31ef11\",\"_type\":\"block\",\"children\":[{\"_key\":\"3e99b4c0d8df0\",\"_type\":\"span\",\"marks\":[],\"text\":\"A. to make our Website available to you;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"66150aca0b54\",\"_type\":\"block\",\"children\":[{\"_key\":\"38ad4097d7fd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"B. to provide you with content which is tailored to your individual tastes;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"102af7b4240b\",\"_type\":\"block\",\"children\":[{\"_key\":\"2e7bce71446b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"C. to provide our services to you;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c6c30db0061e\",\"_type\":\"block\",\"children\":[{\"_key\":\"feb0372e7f100\",\"_type\":\"span\",\"marks\":[],\"text\":\"D. to maintain any registered account that you hold with us and to enable you to take part in our loyalty programme / membership;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2dfdd4549a7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"ea0bd3b8d2780\",\"_type\":\"span\",\"marks\":[],\"text\":\"E. to contact you (including by push notificati "_type\":\"span\",\"marks\":[],\"text\":\"K. obtaining external (legal) advice and/or the establishment, exercise or substantiation of a legal claim; and\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fdfd4b727268\",\"_type\":\"block\",\"children\":[{\"_key\":\"7b6114e7ea880\",\"_type\":\"span\",\"marks\":[],\"text\":\"L. to deliver the Polaroid product that has been gifted to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. How we may store and use your information\"},{\"_key\":\"3bdc6370215f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"1e06e459bdaf\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9af17e1fa6c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"In some cases, we share your personal data with third parties. We only provide your personal data to third parties if this is necessary for one or more of the purposes listed in paragraph 4. Your personal data may be shared with the following parties and/or for the following reasons:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"27c43cfb3468\",\"_type\":\"block\",\"children\":[{\"_key\":\"7ee32ae041e20\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"833fd4b242c6\",\"_type\":\"block\",\"children\":[{\"_key\":\"d4c912e588cf0\",\"_type\":\"span\",\"marks\":[\"strong\",\"em\"],\"text\":\"- Company acquisition or business or asset sale\"},{\"_key\":\"d4c912e588cf1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\":\"},{\"_key\":\"63ad193744a8\",\"_type\":\"span\",\"marks\":[],\"text\":\" in the event that a third party acquires all or part of our business and/or assets, we may disclose your personal data to that third party in connection with the acquisition. In addition, we reserve the right to disclose your personal data to third parties as part of any business or asset sale carried out because Polaroid has gone into insolvency or any similar situation, but only where lawful and compliant with the applicable data protection legislation, as amended from time to time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f45da1d8c2b7\",\"_type\":\"block\",\"children\":[{\"_key\":\"b46575ced55c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5297e5f420b4\",\"_type\":\"block\",\"children\":[{\"_key\":\"6347d229c2fb0\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Comply with applicable law\"},{\"_key\":\"6347d229c2fb1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"f98efa856dda\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary to comply with applicable law or an order of a governmental or law enforcement body. We may also disclose your personal data in response to a request for personal data by a competent authority if we believe disclosure is in accordance with, or is otherwise required by, any applicable law, regulation, or legal process.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"4cf48782e30a\",\"_type\":\"block\",\"children\":[{\"_key\":\"a06f7e26a0dc0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9872a4f3cf2a\",\"_type\":\"block\",\"children\":[{\"_key\":\"2bc97522bda80\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"-Subsidiaries and affiliated entities:\"},{\"_key\":\"2bc97522bda82\",\"_type\":\"span\",\"marks\":[],\"text\":\" we may share your personal data with our subsidiaries and affiliated entities within the Polaroid group that provide services or conduct data processing in relation to the Website or our services on our behalf.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48b5dfdbdbeb\",\"_type\":\"block\",\"children\":[{\"_key\":\"dc1dc14ef5df0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6b3f00d8dd91\",\"_type\":\"block\",\"children\":[{\"_key\":\"d6502b01cad70\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Other relevant parties\"},{\"_key\":\"d6502b01cad71\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"a678045745c3\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary with our processors, vendors, consultants, marketing partners, and other service providers who need access to such personal data to carry out work on our behalf for the performance of any contract we enter into (e.g. Shopify / Klarna, ZenDesk) or requests and input we receive (e.g. loyalty program, back-in-stock notifications, product reviews, newsletter subscriptions, customer requests, customer experience etc.).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"be2edefc6a7a\",\"_type\":\"block\",\"children\":[{\"_key\":\"593fbfcce7010\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bee99afa2961\",\"_type\":\"block\",\"children\":[{\"_key\":\"50f4b12e50500\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Analytics\"},{\"_key\":\"50f4b12e50501\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\":\"},{\"_key\":\"cde0e52be97d\",\"_type\":\"span\",\"marks\":[],\"text\":\"$1e\"},{\"_key\":\"e680889347ed\",\"_type\":\"span\",\"marks\":[\"389455301fa8\"],\"text\":\"Google's privacy policy\"},{\"_key\":\"30d1fff833aa\",\"_type\":\"span\",\"marks\":[],\"text\":\". See also the \"},{\"_key\":\"916bd9f3e723\",\"_type\":\"span\",\"marks\":[\"852464d00690\"],\"text\":\"specific privacy policy of Google Analytics \"},{\"_key\":\"8e01d9e66c9c\",\"_type\":\"span\",\"marks\":[],\"text\":\". For more information about Google's opt-out, see \"},{\"_key\":\"eada7bcaa0a1\",\"_type\":\"span\",\"marks\":[\"1073b9e4e171\"],\"text\":\"here\"},{\"_key\":\"c1d0f24ad281\",\"_type\":\"span\",\"marks\":[],\"text\":\". This Website also uses Hotjar, which complements the data and insights we get from Google Analytics, read \"},{\"_key\":\"b3b1849e342e\",\"_type\":\"span\",\"marks\":[\"68e8389c81d1\"],\"text\":\"Hotjar’s privacy policy\"},{\"_key\":\"fd01e2a536ec\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"389455301fa8\",\"_type\":\"externalLink\",\"href\":\"https://policies.google.com/privacy?hl=en\",\"targetNewWindow\":true},{\"_key\":\"852464d00690\",\"_type\":\"externalLink\",\"href\":\"https://support.google.com/analytics/answer/6004245?hl=en\",\"targetNewWindow\":true},{\"_key\":\"1073b9e4e171\",\"_type\":\"externalLink\",\"href\":\"https://tools.google.com/dlpage/gaoptout\",\"targetNewWindow\":true},{\"_key\":\"68e8389c81d1\",\"_type\":\"externalLink\",\"href\":\"https://www.hotjar.com/legal/policies/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"f9bdf51416c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"f310636294dc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f45775d97ad0\",\"_type\":\"block\",\"children\":[{\"_key\":\"c8fd1a7fc2950\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may, in some cases, merge your personal data with the data of third parties. We do this, for example, to see your previous purchases.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Disclosure of your personal data to third parties\"},{\"_key\":\"1e24e83abedb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"258d513fc551\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ce3fd72c0340\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you subscribe to our newsletter, we will use the personal information necessary or separately provided by you to send you our e-mail newsletter as agreed. If you wish to unsubscribe from email marketing communications that we send you, you can most easily do this by clicking on the unsubscribe link at the bottom of any e-mail marketing communications that we have sent to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Email newsletter\"},{\"_key\":\"5b7fc7d1883b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"85b87b70a6bc\",\"_type\":\"block\",\"children\":[{\"_key\":\"a048f7c208140\",\"_type\":\"span\",\"marks\":[],\"text\":\"Working news media can subscribe to our Newsroom newsletter via \"},{\"_key\":\"19b197ae72c9\",\"_type\":\"span\",\"marks\":[\"ba2b56dab1d4\"],\"text\":\"press.polaroid.com\"},{\"_key\":\"8839b60d8ecc\",\"_type\":\"span\",\"marks\":[],\"text\":\". The Newsroom newsletter will include (embargoed) news, story ideas, and invites to press event. If you subscribe to our Newsroom newsletter, we will use the personal information necessary or sedately provided by you to send you our Newsroom newsletter as agreed. If you wish to unsubscribe from this newsletter, you can do so by clicking on the unsubscribe link at the bottom of any newsletter that we have sent to you. For more information about your privacy in relation to the Newsroom newsletter, please visit \"},{\"_key\":\"ba51ae25f8ef\",\"_type\":\"span\",\"marks\":[\"d11c9d08129a\"],\"text\":\"press.polaroid.com/privacy\"},{\"_key\":\"b002ec331b90\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"ba2b56dab1d4\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/\",\"targetNewWindow\":true},{\"_key\":\"d11c9d08129a\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/privacy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"7. Newsroom newsletter\"},{\"_key\":\"465087a44db3\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"df680e3cea58\",\"_type\":\"block\",\"children\":[{\"_key\":\"217f280cbd0b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"When creating a user account on the Website, you consent to becoming a memberofour loyalty program which is facilitated bythird parties (Shopify and Yotpo). For this purpose, personal data (i.e. (sur)name, email details, profile picture, personal note, and other data you choose to provide to us) and data regarding your order such as order value and potential discounts are transferred to and stored by such third party and will only be used to perform its services in connection with the loyalty program. Your user account will show your loyalty reward points and purchase information and history. If you have signed-up to receive news and offers, we will use your account data to make the offers you receive form us more relevant to you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"79786c8db3a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"9ca579efcd3a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to privacy@polaroid.com or use our custom support form on the website. For more information on the Loyalty program / Membership we refer to the \"},{\"_key\":\"bf8cb6044444\",\"_type\":\"span\",\"marks\":[\"57ac7e90271f\"],\"text\":\"Membership Terms \u0026 Conditions\"},{\"_key\":\"058625d41cdb\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"57ac7e90271f\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/membership-terms-and-conditions\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"8. User account and Loyalty program / Membership\"},{\"_key\":\"4e2182ae9430\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9abd65e42887\",\"_type\":\"block\",\"children\":[{\"_key\":\"c33bf6faf8230\",\"_type\":\"span\",\"marks\":[],\"text\":\"We allow you to register your Polaroid products in your user account on the Website. In order to register a product, you will need to provide us with the following information: product name, country of purchase, serial number, purchase date and place of purchase. By registering your products, you easily gain insight in the warranty period applicable to your Polaroid product. For more information on our warranty terms we refer to the \"},{\"_key\":\"c8afab76467b\",\"_type\":\"span\",\"marks\":[\"c8bbb4db5c36\"],\"text\":\"Warranty Policy\"},{\"_key\":\"e60df545a3a1\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"c8bbb4db5c36\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/warranty-policy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"9. Product registration\"},{\"_key\":\"8205ef91234a\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"de0ebf738f13\",\"_type\":\"block\",\"children\":[{\"_key\":\"76a4bad2f1b50\",\"_type\":\"span\",\"marks\":[],\"text\":\"We offer the option of sending a Polaroid product as a gift. To deliver the gift, we will process the recipient’s personal data (i.e. (sur)name, delivery postal addresses, email details) which we receive from the purchaser of the gift. This personal data will be used solely for the purpose of delivering the gift. We will not use the recipient’s data for marketing or any other purposes.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"10. Gifting\"},{\"_key\":\"a486937fad53\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ef2ff1b0a708\",\"_type\":\"block\",\"children\":[{\"_key\":\"92594fe4d6410\",\"_type\":\"span\",\"marks\":[],\"text\":\"In regard to fraud prevention and combatting, we use services which, among others, help us to determine whether or not a transaction should be made (should there be any doubt). For this purpose, we share certain personal information with third parties that help us to detect and prevent fraudulent transactions. The information we share with those parties includes some of the information that you share with us (such as, your contact details and information about the transaction), and some of the information from your online interactions (such as the IP address of your device). That information is used to determine whether a transaction could be fraudulent. One of the third parties we use to help us detect and prevent fraudulent transactions is a company called Signifyd; they are responsible for their use of your personal information and will use it for the purposes set out in their \"},{\"_key\":\"362d87843bdc\",\"_type\":\"span\",\"marks\":[\"0ab772bb7223\"],\"text\":\"privacy policy\"},{\"_key\":\"282413ad2c85\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"0ab772bb7223\",\"_type\":\"externalLink\",\"href\":\"https://www.signifyd.com/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"11. Fraud prevention\"},{\"_key\":\"0362bfbb4508\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"42f12ef9034f\",\"_type\":\"block\",\"children\":[{\"_key\":\"148c761782490\",\"_type\":\"span\",\"marks\":[],\"text\":\"For advertising purposes, we use the e-mail addressesof our customers and (insofar they have provided their consent) our newsletter subscribers to (i) show them Polaroid advertisements through third party websites and (ii) generate “look-a-like audience” or similar audience of potential customers through Meta or Google’s advertising platforms. This allows us to target ads on their networks to existing customers and potential customers who appear to have similar interests or demographics to our existing customers and newsletter subscribers, based on the platform’s own data.We do this by uploading a list of email addresses. \"},{\"_key\":\"f0237ff8819f\",\"_type\":\"span\",\"marks\":[\"af6062ca6200\"],\"text\":\"Meta policy\"},{\"_key\":\"3b37d7a594e1\",\"_type\":\"span\",\"marks\":[],\"text\":\" is to irreversibly hash (encrypt) such lists of prior to uploading, match the hashed data against their own users, generate the look-a-like audience, then delete the uploaded list and use it for no other purpose. We do not have access to the identity of anybody in the lookalike audience, unless they choose to click on the ads. If you wish to opt out of target or “similar audiences” in Google, you can do so through your \"},{\"_key\":\"c581a619b846\",\"_type\":\"span\",\"marks\":[\"ea8256113cf3\"],\"text\":\"Ads Settings\"},{\"_key\":\"b631d954f2a9\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"af6062ca6200\",\"_type\":\"externalLink\",\"href\":\"https://www.facebook.com/business/help/112061095610075?id=2469097953376494\",\"targetNewWindow\":true},{\"_key\":\"ea8256113cf3\",\"_type\":\"externalLink\",\"href\":\"https://adssettings.google.com/anonymous?hl=en\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"12. Look-a-like audiences\"},{\"_key\":\"c78bd0084e83\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"e1521aeb2d5b\",\"_type\":\"block\",\"children\":[{\"_key\":\"9c8e443eed5c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid uses essential, analytics and tracking cookies on the Website, as well as comparable technologies.For more information, or to change or withdraw your cookie consent settings, please see our\"},{\"_key\":\"8fd0c540f802\",\"_type\":\"span\",\"marks\":[\"a505289e5f3f\"],\"text\":\" cookies policy\"},{\"_key\":\"86ddc09bb432\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"a505289e5f3f\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"86230e6b-45d5-4482-988e-30c2c2251c12\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"13. Cookies and comparable technologies\"},{\"_key\":\"37ed9552dbc8\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"7bf986a24e31\",\"_type\":\"block\",\"children\":[{\"_key\":\"fc242a2b5d2f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"We (or our processors) may transfer personal data that we collect from you to third party (sub) processors located in countries that are outside of the European Economic Area (\"},{\"_key\":\"fc242a2b5d2f1\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EEA\"},{\"_key\":\"fc242a2b5d2f2\",\"_type\":\"span\",\"marks\":[],\"text\":\") and to other Polaroid group companies in connection with the above purposes.For example, some Polaroid group companies or processors are domiciled in the United States, which leads to the disclosing of your personal data outside the EEA.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fee05a8b39bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"b610612eb2fd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"In such situations, we will ensure that appropriate safeguards are in place that offer an adequate level of protection of your rights and freedoms as a data subject in accordance with the GDPR. We do this, for example, by concluding standard contractual clauses for the transfer of personal data approved by the European Commission, or by transferring your personal data only to third parties that are considered to guarantee an adequate level of protection according to the European Commission.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"14. International transfers\"},{\"_key\":\"fa864708ae9f\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"8a9ee8ab8b37\",\"_type\":\"block\",\"children\":[{\"_key\":\"48da7c1cf6e80\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will never ask you to confirm any account or credit card details via email. If you receive an email claiming to be from us asking you to do so, please ignore it and do not respond. You may forward any such e-mail to \"},{\"_key\":\"b39bec060f66\",\"_type\":\"span\",\"marks\":[\"f43b5f0813eb\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"74227b935b2c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"f43b5f0813eb\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"15. Spoof/false emails\"},{\"_key\":\"db8e8f603487\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"9c8c8e1b4e20\",\"_type\":\"block\",\"children\":[{\"_key\":\"17fc0abf6ad90\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will retain your personal data for no longer than is necessary for the purpose(s) for which it is collected or processed and/or in accordance with legal obligations.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"91ec4a6b03ee\",\"_type\":\"block\",\"children\":[{\"_key\":\"f9c44335b8cc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Below you will find an overview of the typical retention periods we apply for different types of processing activities:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"69bc5e9a71da\",\"_type\":\"block\",\"children\":[{\"_key\":\"00c8b7436f0f0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"User Account / Loyalty Program\"},{\"_key\":\"00c8b7436f0f1\",\"_type\":\"span\",\"marks\":[],\"text\":\": If you have a user account with us, we will keep your data for up to 2 years after your last login or interaction, unless you ask us to remove your account earlier. If you don’t reactivate your account during this time, we will notify you and either delete or anonymize your data unless you let us know you wish to keep your account active.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e04808fef3bc\",\"_type\":\"block\",\"children\":[{\"_key\":\"be95752118970\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Order and Transaction Data:\"},{\"_key\":\"be95752118971\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data related to your purchases, orders, and returns is retained for 7 years after the end of the relevant tax year, in accordance with legal obligations for accounting and tax purposes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"464cd5bc1120\",\"_type\":\"block\",\"children\":[{\"_key\":\"81289f4b4cc80\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Newsletter Subscription:\"},{\"_key\":\"81289f4b4cc81\",\"_type\":\"span\",\"marks\":[],\"text\":\" If you subscribe to our newsletter or receive marketing communications, we retain your data until you unsubscribe or withdraw your consent.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c028e19521b1\",\"_type\":\"block\",\"children\":[{\"_key\":\"5506759b8e5d0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Customer Service and Complaints:\"},{\"_key\":\"5506759b8e5d1\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected in connection with customer service requests or complaints is retained for up to 2 years after the issue is resolved, unless a longer retention period is required due to legal claims or disputes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f0b55dd59b54\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b481f682f880\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Fraud Prevention:\"},{\"_key\":\"1b481f682f881\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data processed for fraud prevention is retained for up to 5 years, unless a longer period is required for ongoing investigations or legal proceedings.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"461d91f36db0\",\"_type\":\"block\",\"children\":[{\"_key\":\"849d3adae9020\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Cookies and Analytics:\"},{\"_key\":\"849d3adae9021\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected via cookies and similar technologies is retained according to our cookie policy, typically ranging from session-based retention to a maximum of 2 years.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"310777e080d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"a1c1c9123e0d0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Usage and preference data, Device data, Location data and Log data:\"},{\"_key\":\"a1c1c9123e0d1\",\"_type\":\"span\",\"marks\":[],\"text\":\" This type of data will be anonymized as soon as we collect it.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"44ccf71312b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"e595593ba5c10\",\"_type\":\"span\",\"marks\":[],\"text\":\"After a retention period, we will delete or anonymize your personal data, unless we retain (part of) of your personal data for another purpose. We will only do so if we have a legal basis to retain your personal data. We will ensure that personal data are only accessible for that other purpose.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"48c8727665a3\",\"_type\":\"block\",\"children\":[{\"_key\":\"3d2a9318d5320\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you would like to receive more information about the retention periods that we apply, please contact us on \"},{\"_key\":\"7e83e101698a\",\"_type\":\"span\",\"marks\":[\"3110ee924dd4\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"50f62e0784d6\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"3110ee924dd4\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"16. Data retention\"},{\"_key\":\"14207bce66d4\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b1b2e7ad87e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"6f311f68ddbd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"As a data subject, you have a number of rights that you may exercise in the context of our processing of your personal data:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"328a13996252\",\"_type\":\"block\",\"children\":[{\"_key\":\"b654b50519af0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f05747717213\",\"_type\":\"block\",\"children\":[{\"_key\":\"c76addd3dedd0\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"c76addd3dedd1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right of information\"},{\"_key\":\"c76addd3dedd2\",\"_type\":\"span\",\"marks\":[],\"text\":\" about the personal data we process about you;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"eb1d2683c89d\",\"_type\":\"block\",\"children\":[{\"_key\":\"b4cb31c2c7cf0\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"b4cb31c2c7cf1\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right ata subject, we will do our best to directly inform you about those changes. All changes will take effect as soon as the Privacy Policy has been published on the Website.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"19. Updates to this Privacy Policy\"},{\"_key\":\"cce594626bae\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"d3b8eace1d58\",\"_type\":\"block\",\"children\":[{\"_key\":\"364074b604cb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"In case you have any questions or complaints regarding the processing or your personal data, please contact us on \"},{\"_key\":\"8cf0ada63ef4\",\"_type\":\"span\",\"marks\":[\"952272d15390\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"717b0d28b905\",\"_type\":\"span\",\"marks\":[],\"text\":\". If you are of the opinion that we process your personal data in an improper or unlawful manner, that we do not/insufficiently take regard of your objection or request in the context of your rights or if you wish to make a complaint in the context of the processing of your personal data, you have at all times the right to lodge a complaint with the competent Data Protection Authority.\"}],\"markDefs\":[{\"_key\":\"952272d15390\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"20. Contact us\"}],\"blocks_us\":[{\"_key\":\"402b47eec21b\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ed226f469f82\",\"_type\":\"block\",\"children\":[{\"_key\":\"46bfbeb991dd\",\"_type\":\"span\",\"marks\":[],\"text\":\"This Privacy Policy explains how Polaroid International B.V. (\"},{\"_key\":\"63242e66618b\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Polaroid\"},{\"_key\":\"f1bae9da6cc8\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"9655fb9fdc42\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"we\"},{\"_key\":\"13e454ced587\",\"_type\":\"span\",\"marks\":[],\"text\":\" or \"},{\"_key\":\"b6c94c1170ca\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"our\" ct data about the location where your device is used, including where you have registered with us and where you place an order with us; and\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a6e888c3e752\",\"_type\":\"block\",\"children\":[{\"_key\":\"f16a0f733856\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Log data\"},{\"_key\":\"be03ec6b4cb0\",\"_type\":\"span\",\"marks\":[],\"text\":\": when you interact with our services within the Website, we create logs, which include browsing and online shopping activities, access dates and times, app features or web pages viewed, app crashes and other system activity;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5c180ad98f11\",\"_type\":\"block\",\"children\":[{\"_key\":\"400297a796f0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Purchase information and history\"},{\"_key\":\"995a12a4e252\",\"_type\":\"span\",\"marks\":[],\"text\":\": information on your purchases, orders and returns.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"85b4bcd96c2a\",\"_type\":\"block\",\"children\":[{\"_key\":\"cb505ef4342d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"164b0310db0a\",\"_type\":\"block\",\"children\":[{\"_key\":\"52784f9abe43\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Personal data collected from other (third party) sources:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"22aaa88a0598\",\"_type\":\"block\",\"children\":[{\"_key\":\"575030a9374d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"af1801056e00\",\"_type\":\"block\",\"children\":[{\"_key\":\"6e0e224c1207\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Personal data available through public sources\"},{\"_key\":\"9b9fa37d78a1\",\"_type\":\"span\",\"marks\":[],\"text\":\": In order to be able to prope \":\"a3b380e35b30\",\"_type\":\"block\",\"children\":[{\"_key\":\"5de4b57d9340\",\"_type\":\"span\",\"marks\":[],\"text\":\"When processing is based on \"},{\"_key\":\"68eb5412deac\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"consent\"},{\"_key\":\"b5d9285bb1b6\",\"_type\":\"span\",\"marks\":[],\"text\":\", you have the right to refuse consent at any time without prejudice. You also have the right to withdraw your granted consent at any time, after which we will stop the further processing of your personal data. However, withdrawal of your consent does not affect the lawfulness of the processing prior to that moment. Please note that if you withdraw your consent certain features of our Website, products and/or services may no longer be accessible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"3. Legal bases of the processing of your personal data\"},{\"_key\":\"e3e4240dfc6c\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"e0c85dc48eba\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6c7cd87b235\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid (and third party data processors acting on our behalf) may collect, store and process your personal data for the following purposes:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f7b7395c3e46\",\"_type\":\"block\",\"children\":[{\"_key\":\"80824c981eef\",\"_type\":\"span\",\"marks\":[],\"text\":\"A. to make our Website available to you;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"024b287ad159\",\"_type\":\"block\",\"children\":[{\"_key\":\"f45d471ebc8b\",\"_type\":\"span\",\"marks\":[],\"text\":\"B. to provide you with content which is tailored to your individual tastes;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e7490b22850d\",\"_type\":\"block\",\"children\":[{\"_key\":\"bfe8ebbd2230\",\"_type\":\"span\",\"marks\":[],\"text\":\"C. to provide our services to you;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bcddf9eb7068\",\"_type\":\"block\",\"children\":[{\"_key\":\  and legal requests and/or complaints;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1db5f465c924\",\"_type\":\"block\",\"children\":[{\"_key\":\"e19c3d82268a\",\"_type\":\"span\",\"marks\":[],\"text\":\"J. to comply with legal obligations applicable to Polaroid;\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fcf4d549f9ec\",\"_type\":\"block\",\"children\":[{\"_key\":\"b60aa80f2d43\",\"_type\":\"span\",\"marks\":[],\"text\":\"K. obtaining external (legal) advice and/or the establishment, exercise or substantiation of a legal claim; and\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d0acb4969c70\",\"_type\":\"block\",\"children\":[{\"_key\":\"3b193cc3b601\",\"_type\":\"span\",\"marks\":[],\"text\":\"L. to deliver the Polaroid product that has been gifted to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"4. How we may store and use your information\"},{\"_key\":\"63234cbbf916\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b53a382bb6de\",\"_type\":\"block\",\"children\":[{\"_key\":\"d9d621e8eb70\",\"_type\":\"span\",\"marks\":[],\"text\":\"In some cases, we share your personal data with third parties. We only provide your personal data to third parties if this is necessary for one or more of the purposes listed in paragraph 4. Your personal data may be shared with the following parties and/or for the following reasons:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fda2c4b6d5bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"e41dbf715754\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"db247487f7a0\",\"_type\":\"block\",\"children\":[{\"_key\":\"8196cef01b0a\",\"_type\":\"span\",\"marks\":[\"strong\",\"em\"],\"text\":\"- Company acquisition or business or asset sale\"},{\"_key\":\"49c2894e34d9\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\":\"},{\"_key\":\"686406a25bc8\",\"_type\":\"span\",\"marks\":[],\"text\":\" in the event that a third party acquires all or part of our business and/or assets, we may disclose your personal data to that third party in connection with the acquisition. In addition, we reserve the right to disclose your personal data to third parties as part of any business or asset sale carried out because Polaroid has gone into insolvency or any similar situation, but only where lawful and compliant with the applicable data protection legislation, as amended from time to time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"160d13a19146\",\"_type\":\"block\",\"children\":[{\"_key\":\"5d251a3b93ab\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ef18164f9cc8\",\"_type\":\"block\",\"children\":[{\"_key\":\"59b5e13d9ef1\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Comply with applicable law\"},{\"_key\":\"e57f162893e0\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"7f3709eedd3d\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary to comply with applicable law or an order of a governmental or law enforcement body. We may also disclose your personal data in response to a request for personal data by a competent authority if we believe disclosure is in accordance with, or is otherwise required by, any applicable law, regulation, or legal process.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c04ec5754ace\",\"_type\":\"block\",\"children\":[{\"_key\":\"1aa96f82c403\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5ba2efaa9c64\",\"_type\":\"block\",\"children\":[{\"_key\":\"7372a312aeae\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"-Subsidiaries and affiliated entities:\"},{\"_key\":\"4f2b5f79277c\",\"_type\":\"span\",\"marks\":[],\"text\":\" we may share your personal data with our subsidiaries and affiliated entities within the Polaroid group that provide services or conduct data processing in relation to the Website or our services on our behalf.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d43d4ad1d9ad\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a4008b850f8\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"961faab21018\",\"_type\":\"block\",\"children\":[{\"_key\":\"b3c998fffa01\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Other relevant parties\"},{\"_key\":\"e1feb92ea220\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\": \"},{\"_key\":\"b69b325cc1ac\",\"_type\":\"span\",\"marks\":[],\"text\":\"we may disclose your personal data where necessary with our processors, vendors, consultants, marketing partners, and other service providers who need access to such personal data to carry out work on our behalf for the performance of any contract we enter into (e.g. Shopify / Klarna, ZenDesk) or requests and input we receive (e.g. loyalty program, back-in-stock notifications, product reviews, newsletter subscriptions, customer requests, customer experience etc.).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"332f009ad111\",\"_type\":\"block\",\"children\":[{\"_key\":\"4bebe096d2f6\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bd3b9313c155\",\"_type\":\"block\",\"children\":[{\"_key\":\"c0186910280c\",\"_type\":\"span\",\"marks\":[\"em\",\"strong\"],\"text\":\"- Analytics\"},{\"_key\":\"2cba009c51a7\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\":\"},{\"_key\":\"0ae720d4d6ca\",\"_type\":\"span\",\"marks\":[],\"text\":\"$1f\"},{\"_key\":\"a10cdb491ba9\",\"_type\":\"span\",\"marks\":[\"037155b465b0\"],\"text\":\"Google's privacy policy\"},{\"_key\":\"a92da7bbfe74\",\"_type\":\"span\",\"marks\":[],\"text\":\". See also the \"},{\"_key\":\"068c58fcdbe4\",\"_type\":\"span\",\"marks\":[\"20035df63902\"],\"text\":\"specific privacy policy of Google Analytics \"},{\"_key\":\"7951c42c6fa0\",\"_type\":\"span\",\"marks\":[],\"text\":\". For more information about Google's opt-out, see \"},{\"_key\":\"5158c1e81aa7\",\"_type\":\"span\",\"marks\":[\"f994bc974e5e\"],\"text\":\"here\"},{\"_key\":\"efda0fc69816\",\"_type\":\"span\",\"marks\":[],\"text\":\". This Website also uses Hotjar, which complements the data and insights we get from Google Analytics, read \"},{\"_key\":\"bade6677ab3d\",\"_type\":\"span\",\"marks\":[\"7602ceccedb3\"],\"text\":\"Hotjar’s privacy policy\"},{\"_key\":\"8ccc55c00a14\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"037155b465b0\",\"_type\":\"externalLink\",\"href\":\"https://policies.google.com/privacy?hl=en\",\"targetNewWindow\":true},{\"_key\":\"20035df63902\",\"_type\":\"externalLink\",\"href\":\"https://support.google.com/analytics/answer/6004245?hl=en\",\"targetNewWindow\":true},{\"_key\":\"f994bc974e5e\",\"_type\":\"externalLink\",\"href\":\"https://tools.google.com/dlpage/gaoptout\",\"targetNewWindow\":true},{\"_key\":\"7602ceccedb3\",\"_type\":\"externalLink\",\"href\":\"https://www.hotjar.com/legal/policies/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"},{\"_key\":\"b9cf38baceff\",\"_type\":\"block\",\"children\":[{\"_key\":\"d3575e57d9d6\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"661744c16d7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"2d326663f94a\",\"_type\":\"span\",\"marks\":[],\"text\":\"We may, in some cases, merge your personal data with the data of third parties. We do this, for example, to see your previous purchases.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"5. Disclosure of your personal data to third parties\"},{\"_key\":\"c7bea5c99317\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"14b4b440a0e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"bdbd85c872cc\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you subscribe to our newsletter, we will use the personal information necessary or separately provided by you to send you our e-mail newsletter as agreed. If you wish to unsubscribe from email marketing communications that we send you, you can most easily do this by clicking on the unsubscribe link at the bottom of any e-mail marketing communications that we have sent to you.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"6. Email newsletter\"},{\"_key\":\"5e3b4e186fc1\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"3d497feecb3c\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ae4ee815012\",\"_type\":\"span\",\"marks\":[],\"text\":\"Working news media can subscribe to our Newsroom newsletter via \"},{\"_key\":\"d4dce82744a3\",\"_type\":\"span\",\"marks\":[\"f7525163a3b0\"],\"text\":\"press.polaroid.com\"},{\"_key\":\"4a88b201fde3\",\"_type\":\"span\",\"marks\":[],\"text\":\". The Newsroom newsletter will include (embargoed) news, story ideas, and invites to press event. If you subscribe to our Newsroom newsletter, we will use the personal information necessary or sedately provided by you to send you our Newsroom newsletter as agreed. If you wish to unsubscribe from this newsletter, you can do so by clicking on the unsubscribe link at the bottom of any newsletter that we have sent to you. For more information about your privacy in relation to the Newsroom newsletter, please visit \"},{\"_key\":\"e9c11785c99d\",\"_type\":\"span\",\"marks\":[\"68c8662a0fa2\"],\"text\":\"press.polaroid.com/privacy\"},{\"_key\":\"711bc259f840\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"f7525163a3b0\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/\",\"targetNewWindow\":true},{\"_key\":\"68c8662a0fa2\",\"_type\":\"externalLink\",\"href\":\"https://press.polaroid.com/privacy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"7. Newsroom newsletter\"},{\"_key\":\"9c8c687f60fb\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"f61990e899bb\",\"_type\":\"block\",\"children\":[{\"_key\":\"1971bcb166ff\",\"_type\":\"span\",\"marks\":[],\"text\":\"When creating a user account on the Website, you consent to becoming a memberofour loyalty program which is facilitated bythird parties (Shopify and Yotpo). For this purpose, personal data (i.e. (sur)name, email details, profile picture, personal note, and other data you choose to provide to us) and data regarding your order such as order value and potential discounts are transferred to and stored by such third party and will only be used to perform its services in connection with the loyalty program. Your user account will show your loyalty reward points and purchase information and history. If you have signed-up to receive news and offers, we will use your account data to make the offers you receive form us more relevant to you.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8851777e69b0\",\"_type\":\"block\",\"children\":[{\"_key\":\"468146a70e4b\",\"_type\":\"span\",\"marks\":[],\"text\":\"You may request Polaroid to delete your account at any time by reaching out to privacy@polaroid.com or use our custom support form on the website. For more information on the Loyalty program / Membership we refer to the \"},{\"_key\":\"e71bf5a48696\",\"_type\":\"span\",\"marks\":[\"2148098625a9\"],\"text\":\"Membership Terms \u0026 Conditions\"},{\"_key\":\"b2b292edcd5c\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"2148098625a9\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/membership-terms-and-conditions\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"8. User account and Loyalty program / Membership\"},{\"_key\":\"6a8d50435047\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"b067ed3972bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"f7ca786a379f\",\"_type\":\"span\",\"marks\":[],\"text\":\"We allow you to register your Polaroid products in your user account on the Website. In order to register a product, you will need to provide us with the following information: product name, country of purchase, serial number, purchase date and place of purchase. By registering your products, you easily gain insight in the warranty period applicable to your Polaroid product. For more information on our warranty terms we refer to the \"},{\"_key\":\"a3ec4b5256f3\",\"_type\":\"span\",\"marks\":[\"2a3cdf2a5a30\"],\"text\":\"Warranty Policy\"},{\"_key\":\"8cbbfabd5266\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"2a3cdf2a5a30\",\"_type\":\"externalLink\",\"href\":\"https://www.polaroid.com/en_nl/legal/warranty-policy\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"9. Product registration\"},{\"_key\":\"6d2c1e0b71ed\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"79b6c265eba3\",\"_type\":\"block\",\"children\":[{\"_key\":\"47dc71114534\",\"_type\":\"span\",\"marks\":[],\"text\":\"We offer the option of sending a Polaroid product as a gift. To deliver the gift, we will process the recipient’s personal data (i.e. (sur)name, delivery postal addresses, email details) which we receive from the purchaser of the gift. This personal data will be used solely for the purpose of delivering the gift. We will not use the recipient’s data for marketing or any other purposes.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"10. Gifting\"},{\"_key\":\"7ee017c7b618\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"ea9c16c04a7c\",\"_type\":\"block\",\"children\":[{\"_key\":\"673c3d140e44\",\"_type\":\"span\",\"marks\":[],\"text\":\"In regard to fraud prevention and combatting, we use services which, among others, help us to determine whether or not a transaction should be made (should there be any doubt). For this purpose, we share certain personal information with third parties that help us to detect and prevent fraudulent transactions. The information we share with those parties includes some of the information that you share with us (such as, your contact details and information about the transaction), and some of the information from your online interactions (such as the IP address of your device). That information is used to determine whether a transaction could be fraudulent. One of the third parties we use to help us detect and prevent fraudulent transactions is a company called Signifyd; they are responsible for their use of your personal information and will use it for the purposes set out in their \"},{\"_key\":\"a196bd6531bb\",\"_type\":\"span\",\"marks\":[\"1ce50d4a7142\"],\"text\":\"privacy policy\"},{\"_key\":\"a4fc2dc15008\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"1ce50d4a7142\",\"_type\":\"externalLink\",\"href\":\"https://www.signifyd.com/privacy/\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"11. Fraud prevention\"},{\"_key\":\"37de368036ac\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"3a0d37239d92\",\"_type\":\"block\",\"children\":[{\"_key\":\"bec70d91fefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"For advertising purposes, we use the e-mail addressesof our customers and (insofar they have provided their consent) our newsletter subscribers to (i) show them Polaroid advertisements through third party websites and (ii) generate “look-a-like audience” or similar audience of potential customers through Meta or Google’s advertising platforms. This allows us to target ads on their networks to existing customers and potential customers who appear to have similar interests or demographics to our existing customers and newsletter subscribers, based on the platform’s own data.We do this by uploading a list of email addresses. \"},{\"_key\":\"2dbc6a47d0e3\",\"_type\":\"span\",\"marks\":[\"8ff52fc8a210\"],\"text\":\"Meta policy\"},{\"_key\":\"34c0336da7aa\",\"_type\":\"span\",\"marks\":[],\"text\":\" is to irreversibly hash (encrypt) such lists of prior to uploading, match the hashed data against their own users, generate the look-a-like audience, then delete the uploaded list and use it for no other purpose. We do not have access to the identity of anybody in the lookalike audience, unless they choose to click on the ads. If you wish to opt out of target or “similar audiences” in Google, you can do so through your \"},{\"_key\":\"9a0beb9424c1\",\"_type\":\"span\",\"marks\":[\"339bc1b0a18e\"],\"text\":\"Ads Settings\"},{\"_key\":\"252668e4a9d8\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"8ff52fc8a210\",\"_type\":\"externalLink\",\"href\":\"https://www.facebook.com/business/help/112061095610075?id=2469097953376494\",\"targetNewWindow\":true},{\"_key\":\"339bc1b0a18e\",\"_type\":\"externalLink\",\"href\":\"https://adssettings.google.com/anonymous?hl=en\",\"targetNewWindow\":true}],\"style\":\"normal\"}],\"title\":\"12. Look-a-like audiences\"},{\"_key\":\"33666719b52e\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"f26e05f796fd\",\"_type\":\"block\",\"children\":[{\"_key\":\"1d54ecf8658d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Polaroid uses essential, analytics and tracking cookies on the Website, as well as comparable technologies.For more information, or to change or withdraw your cookie consent settings, please see our\"},{\"_key\":\"35993be6e059\",\"_type\":\"span\",\"marks\":[\"6d56fc3c29ab\"],\"text\":\" cookies policy\"},{\"_key\":\"48c2e9e0c7e8\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"6d56fc3c29ab\",\"_type\":\"internalLink\",\"reference\":{\"_ref\":\"86230e6b-45d5-4482-988e-30c2c2251c12\",\"_type\":\"reference\"}}],\"style\":\"normal\"}],\"title\":\"13. Cookies and comparable technologies\"},{\"_key\":\"e27b669faae8\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"012d6bd8c2b9\",\"_type\":\"block\",\"children\":[{\"_key\":\"671f1e78c770\",\"_type\":\"span\",\"marks\":[],\"text\":\"We (or our processors) may transfer personal data that we collect from you to third party (sub) processors located in countries that are outside of the European Economic Area (\"},{\"_key\":\"597b3903b416\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"EEA\"},{\"_key\":\"159ad053ffe6\",\"_type\":\"span\",\"marks\":[],\"text\":\") and to other Polaroid group companies in connection with the above purposes.For example, some Polaroid group companies or processors are domiciled in the United States, which leads to the disclosing of your personal data outside the EEA.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bed3318808aa\",\"_type\":\"block\",\"children\":[{\"_key\":\"ed34ed3157ec\",\"_type\":\"span\",\"marks\":[],\"text\":\"In such situations, we will ensure that appropriate safeguards are in place that offer an adequate level of protection of your rights and freedoms as a data subject in accordance with the GDPR. We do this, for example, by concluding standard contractual clauses for the transfer of personal data approved by the European Commission, or by transferring your personal data only to third parties that are considered to guarantee an adequate level of protection according to the European Commission.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":\"14. International transfers\"},{\"_key\":\"ed6cc2f374d0\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"0d23c945210f\",\"_type\":\"block\",\"children\":[{\"_key\":\"d88b255cd6e7\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will never ask you to confirm any account or credit card details via email. If you receive an email claiming to be from us asking you to do so, please ignore it and do not respond. You may forward any such e-mail to \"},{\"_key\":\"2065530798dc\",\"_type\":\"span\",\"marks\":[\"71cbc6dc724e\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"b9af9df21127\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"71cbc6dc724e\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"15. Spoof/false emails\"},{\"_key\":\"fac08844ac62\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"feb4a34bb6df\",\"_type\":\"block\",\"children\":[{\"_key\":\"7a5e9030f841\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will retain your personal data for no longer than is necessary for the purpose(s) for which it is collected or processed and/or in accordance with legal obligations.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f04c3a20cc77\",\"_type\":\"block\",\"children\":[{\"_key\":\"8f3cca2384c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Below you will find an overview of the typical retention periods we apply for different types of processing activities:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"37a001a8615d\",\"_type\":\"block\",\"children\":[{\"_key\":\"2dade4c1823f\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"User Account / Loyalty Program\"},{\"_key\":\"0a2a086228a5\",\"_type\":\"span\",\"marks\":[],\"text\":\": If you have a user account with us, we will keep your data for up to 2 years after your last login or interaction, unless you ask us to remove your account earlier. If you don’t reactivate your account during this time, we will notify you and either delete or anonymize your data unless you let us know you wish to keep your account active.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"93003420df97\",\"_type\":\"block\",\"children\":[{\"_key\":\"c45f223a8e7e\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Order and Transaction Data:\"},{\"_key\":\"c26a2838a1d4\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data related to your purchases, orders, and returns is retained for 7 years after the end of the relevant tax year, in accordance with legal obligations for accounting and tax purposes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"297e6d6590c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"2b3cbb4c9d0a\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Newsletter Subscription:\"},{\"_key\":\"e9c3c584be86\",\"_type\":\"span\",\"marks\":[],\"text\":\" If you subscribe to our newsletter or receive marketing communications, we retain your data until you unsubscribe or withdraw your consent.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0ea0a404782a\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b29f731bc98\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Customer Service and Complaints:\"},{\"_key\":\"cc6a94572878\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected in connection with customer service requests or complaints is retained for up to 2 years after the issue is resolved, unless a longer retention period is required due to legal claims or disputes.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"32f7d744cc47\",\"_type\":\"block\",\"children\":[{\"_key\":\"de59e252647b\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Fraud Prevention:\"},{\"_key\":\"d5248da431a1\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data processed for fraud prevention is retained for up to 5 years, unless a longer period is required for ongoing investigations or legal proceedings.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"afc4caf0eb11\",\"_type\":\"block\",\"children\":[{\"_key\":\"cc0dbd329785\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Cookies and Analytics:\"},{\"_key\":\"25d064a70450\",\"_type\":\"span\",\"marks\":[],\"text\":\" Data collected via cookies and similar technologies is retained according to our cookie policy, typically ranging from session-based retention to a maximum of 2 years.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ee57a3d325e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"54b60ded308d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Usage and preference data, Device data, Location data and Log data:\"},{\"_key\":\"14fe335d26c0\",\"_type\":\"span\",\"marks\":[],\"text\":\" This type of data will be anonymized as soon as we collect it.\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9fa43536d50b\",\"_type\":\"block\",\"children\":[{\"_key\":\"ba6b8dbe3e93\",\"_type\":\"span\",\"marks\":[],\"text\":\"After a retention period, we will delete or anonymize your personal data, unless we retain (part of) of your personal data for another purpose. We will only do so if we have a legal basis to retain your personal data. We will ensure that personal data are only accessible for that other purpose.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f8a2b4eb05e2\",\"_type\":\"block\",\"children\":[{\"_key\":\"436ee257f0e6\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you would like to receive more information about the retention periods that we apply, please contact us on \"},{\"_key\":\"c633b7eb22e8\",\"_type\":\"span\",\"marks\":[\"5fc2a2653f96\"],\"text\":\"privacy@polaroid.com\"},{\"_key\":\"6cc7b83b0040\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"5fc2a2653f96\",\"_type\":\"emailLink\",\"mailAddress\":\"privacy@polaroid.com\"}],\"style\":\"normal\"}],\"title\":\"16. Data retention\"},{\"_key\":\"9a391349406d\",\"_type\":\"textBlock\",\"text\":[{\"_key\":\"2f1915facb85\",\"_type\":\"block\",\"children\":[{\"_key\":\"00652ad9feff\",\"_type\":\"span\",\"marks\":[],\"text\":\"As a data subject, you have a number of rights that you may exercise in the context of our processing of your personal data:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"391d405f1f15\",\"_type\":\"block\",\"children\":[{\"_key\":\"befb4d38d4de\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"70e73e0f8325\",\"_type\":\"block\",\"children\":[{\"_key\":\"6984560d3e37\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"810e662530c3\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right of information\"},{\"_key\":\"a7ae7352233a\",\"_type\":\"span\",\"marks\":[],\"text\":\" about the personal data we process about you;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f81d97e9991c\",\"_type\":\"block\",\"children\":[{\"_key\":\"e2feeffc9ec2\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"8f7d20110b32\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to access\"},{\"_key\":\"e239b719bdbc\",\"_type\":\"span\",\"marks\":[],\"text\":\" your processed personal data;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5c496f446ede\",\"_type\":\"block\",\"children\":[{\"_key\":\"da018348f17c\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"e4954b6b8d79\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to rectification of the\"},{\"_key\":\"9d61f4b47f1f\",\"_type\":\"span\",\"marks\":[],\"text\":\" personal data that we hold about you;\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8b75442c5d8a\",\"_type\":\"block\",\"children\":[{\"_key\":\"63a2afc54f1b\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"bb03be9dc640\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to erasure\"},{\"_key\":\"14d966b2779c\",\"_type\":\"span\",\"marks\":[],\"text\":\" of your personal data (under circumstances listed in the applicable law);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ef8a07cef534\",\"_type\":\"block\",\"children\":[{\"_key\":\"95a6a5999bd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"the \"},{\"_key\":\"8b5bd1d106d5\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"right to restrict\"},{\"_key\":\"b349e036d3c0\",\"_type\":\"span\",\"marks\":[],\"text\":\" the processing of your personal data (under circumstances listed in the applicable law);\"}],\"level\":1,\"listItem\":\"arrow\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a6fa03a3e58f\",\"_type\":\"block\",\"children\":[{\"_key\":\"e2fbdbd5073e\",\"_type\":\"
